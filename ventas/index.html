<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ventas On Line</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ventas">
<link rel="icon" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  /* Tema negro y amarillo (oct 2026) */
  html{color-scheme:dark}
  :root{
    --fondo:#000000; --tarjeta:#161616; --texto:#f5f5f5; --suave:#9b9b9b; --linea:#262626;
    --oro:#f0b90b; --oro-t:#f0b90b; --negro:#1d1a0d;
    --efectivo:#f0b90b; --transferencia:#ef4444; --nequi:#8b5cf6; --wompi:#0ea5e9; --otros:#8a8a8a;
    --bien:#2ecc71; --bien-f:#0f2417; --mal:#ff5252; --mal-f:#1a1a1a; --ojo:#f5c542; --ojo-f:#2a2410;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--fondo)}
  body{font-family:Inter,system-ui,sans-serif;color:var(--texto);-webkit-font-smoothing:antialiased;padding-bottom:84px}
  .nav{position:sticky;top:0;z-index:5;background:#000000;border-bottom:1px solid #2a2a2a;padding:14px 16px;display:flex;align-items:center;gap:10px}
  .nav h1{font-size:20px;font-weight:800;flex:1}
  .nav .atras{font-size:26px;line-height:1;color:var(--texto);background:none;border:0;padding:0 6px 0 0;display:none}
  .nav small{font-size:12px;color:var(--suave);font-weight:600}
  .wrap{padding:14px 16px;max-width:560px;margin:0 auto}
  .card{background:var(--tarjeta);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:14px}
  .meta{color:var(--oro-t);font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
  .big{font-size:34px;font-weight:800;margin:4px 0;letter-spacing:-.5px}
  .d{color:var(--suave);font-size:13px}
  h3{font-size:16px;font-weight:700;margin-bottom:12px}
  .pill{display:inline-block;border-radius:20px;padding:3px 9px;font-size:12px;font-weight:700}
  .p-bien{background:var(--bien-f);color:var(--bien)} .p-mal{background:var(--mal-f);color:var(--mal)} .p-ojo{background:var(--ojo-f);color:var(--ojo)}
  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .kpi{background:#0f0f0f;border-radius:10px;padding:9px 10px}
  .kpi b{display:block;font-size:15px;font-weight:800}
  .kpi span{font-size:11px;color:var(--suave);font-weight:600}
  /* gráfico de barras verticales */
  .chart{position:relative;height:190px;margin:8px 0 30px 40px}
  .tk{position:absolute;left:-40px;right:0;border-top:1px dashed #2a2a2a}
  .tk span{position:absolute;top:-8px;font-size:10px;color:#8a8a8a}
  .bars{position:absolute;inset:0;display:flex;justify-content:space-around;align-items:flex-end}
  .bc{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;flex:1}
  .bar{width:62%;max-width:44px;display:flex;flex-direction:column;border-radius:6px 6px 0 0;overflow:hidden;min-height:2px;background:#2a2a2a}
  .bar div{width:100%}
  .bl{position:absolute;bottom:-22px;font-size:10.5px;color:#b5b5b5;font-weight:600;white-space:nowrap}
  .bv{font-size:10px;color:var(--suave);font-weight:700;margin-bottom:3px}
  .lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#b5b5b5;justify-content:center}
  .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  /* lista */
  .lista{padding:2px 16px}
  .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--linea);cursor:pointer}
  .it:last-child{border:0}
  .av{width:46px;height:46px;border-radius:12px;background:var(--negro);color:var(--oro);font-family:Montserrat;font-weight:900;
      display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
  .tx{flex:1;min-width:0}
  .ti{font-weight:800;font-size:17px}
  .ch{color:#8a8a8a;font-size:22px}
  /* filas de datos */
  .fila{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--linea);font-size:14px}
  .fila:last-child{border:0}
  .fila span{color:var(--suave)} .fila b{font-weight:700}
  .prog{height:10px;background:#2a2a2a;border-radius:6px;overflow:hidden;margin:8px 0 4px}
  .prog div{height:100%;border-radius:6px}
  .ind{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--linea)}
  .ind:last-child{border:0}
  .ind .n{font-weight:600}
  .ind .r{font-weight:800;text-align:right}
  .ind .o{color:var(--suave);font-size:11px;grid-column:1/2}
  /* chips */
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
  .chip{flex:none;border:1px solid #2a2a2a;background:#161616;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700;color:#d6d6d6}
  .chip.on{background:var(--negro);color:var(--oro);border-color:var(--negro)}
  select{width:100%;font-family:inherit;font-size:14px;font-weight:600;padding:11px 12px;border-radius:12px;border:1px solid #2a2a2a;background:#161616;margin-bottom:12px;color:var(--texto)}
  .concl{font-size:14px;line-height:1.5;color:#d6d6d6}
  .concl > div > div{margin-bottom:10px}
  .alerta{background:var(--ojo-f);color:#f3e2a6;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:14px}
  .cajas span{display:inline-block;background:#000000;border-radius:20px;padding:5px 11px;margin:6px 6px 0 0;font-size:12px;font-weight:600;color:#d6d6d6}
  .cajas span.on:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:6px;vertical-align:0}
  .btn{display:block;width:100%;background:var(--oro);color:#1a1300;border:0;border-radius:14px;padding:14px;font-family:inherit;font-weight:800;font-size:15px;margin-top:4px}
  .btn:disabled{opacity:.55}
  .pie{text-align:center;margin:14px 0 4px;font-size:12px;color:var(--suave);font-weight:600;line-height:1.6}
  .cargando{text-align:center;padding:90px 0;color:var(--suave);font-weight:700}
  .cargando .p{font-size:44px;display:inline-block;animation:gira 1.2s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .error{background:var(--mal-f);color:var(--mal);border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
  /* barra de pestañas */
  .tabs{position:fixed;left:0;right:0;bottom:0;background:#000000;border-top:1px solid #2a2a2a;display:flex;z-index:6;
        padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;background:none;border:0;padding:9px 0 10px;font-family:inherit;font-size:11px;font-weight:700;color:#8a8a8a}
  .tab .ic{display:block;font-size:21px;margin-bottom:2px;filter:grayscale(1);opacity:.6}
  .tab.on{color:var(--oro)} .tab.on .ic{filter:none;opacity:1}
  /* tarjeta compacta de sede (estilo Glide, fondo blanco) */
  .sm-card{background:var(--tarjeta);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:14px}
  .sm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
  .sm-k{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .sm-k div{background:#0f0f0f;border-radius:12px;padding:10px 12px}
  .sm-k span{display:block;font-size:12px;color:var(--suave);font-weight:600}
  .sm-k b{display:block;font-size:16px;font-weight:800;margin-top:2px}
  .sm-h{color:var(--oro-t);font-size:16px;font-weight:800;margin:2px 0}
  .sm-i{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--linea);gap:10px}
  .sm-i:last-of-type{border:0}
  .sm-i .n{color:var(--oro-t);font-weight:700;font-size:14px}
  .sm-i .mt{display:inline-block;background:#000000;color:var(--suave);font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:4px;white-space:nowrap;display:table}
  .sm-box{border-radius:10px;padding:6px 10px;text-align:right;min-width:108px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .sm-box .p{font-weight:800;font-size:15px}
  .sm-box .a{font-size:11px;font-weight:600}
  .sm-bok{background:#0f2417} .sm-bok .p{color:#2ecc71} .sm-bok .a{color:#6fcf97}
  .sm-brv{background:#2a2410} .sm-brv .p{color:#f5c542} .sm-brv .a{color:#d4b25a}
  .sm-b0{background:#000000} .sm-b0 .p{color:#b5b5b5} .sm-b0 .a{color:#8a8a8a}
  .sm-pie{color:var(--suave);font-size:12px;margin-top:8px}
  .oculto{display:none}
</style>
</head>

    <h1 id="titulo">VENTA HOY</h1>

  </div>

  <div class="wrap" id="v-hoy"><div class="cargando"><div class="p">🍕</div><div>Consultando la venta…</div></div></div>
  <div class="wrap oculto" id="v-semana"><div class="cargando"><div class="p">🍕</div><div>Cargando la semana…</div></div></div>
  <div class="wrap oculto" id="v-mes"><div class="cargando"><div class="p">🍕</div><div>Cargando el mes…</div></div></div>
  <div class="wrap oculto" id="v-detalle"></div>

  <nav class="tabs">
    <button class="tab on" data-t="hoy" onclick="ir('hoy')"><span class="ic">🍕</span>Hoy</button>
    <button class="tab" data-t="semana" onclick="ir('semana')"><span class="ic">📅</span>Semana</button>
    <button class="tab" data-t="mes" onclick="ir('mes')"><span class="ic">📈</span>Mes</button>
  </nav>

<script>
  var API = 'https://script.google.com/macros/s/AKfycbwvY4OsVG8hCLAXSRKkxvLpkZWw33pVBBp0auVcy7ehJ8uM3YPmkX82a6gEhUW9dM69/exec';
  var CLAVE = new URLSearchParams(location.search).get('k') || '';
  try { if (CLAVE) localStorage.setItem('pg_k_ventas', CLAVE); else CLAVE = localStorage.getItem('pg_k_ventas') || ''; } catch (e) {}
  function llamarApi(fn, ok, mal){
    if (!CLAVE) { mal(new Error('Link incompleto. Pide el link completo de Ventas.')); return; }
    fetch(API + '?api=' + fn + '&k=' + encodeURIComponent(CLAVE), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(x){ if (x && x.__error) mal(new Error(x.__error)); else ok(x); })
      .catch(function(){ mal(new Error('sin conexión con el sistema. Revisa el internet.')); });
  }
  var google = {script:{run:{withSuccessHandler:function(ok){ return {withFailureHandler:function(mal){ return {
    vhDatos:function(){ llamarApi('datos', ok, mal); },
    vhResumen:function(){ llamarApi('resumen', ok, mal); }
  }; }}; }}}};
  var MEDIOS = [['efectivo','Efectivo','var(--efectivo)'],['transferencia','Transferencia','var(--transferencia)'],
                ['nequi','Nequi','var(--nequi)'],['wompi','Wompi','var(--wompi)'],['otros','Otros','var(--otros)']];
  var HOY = null, RES = null, pestana = 'hoy', cargandoHoy = false, cargandoRes = false;
  var semSel = null, sedeSemSel = 'TOTAL 4 SEDES';

  /* ---------- utilidades ---------- */
  function $(n){ return (n<0?'-':'') + '$' + Math.abs(Math.round(n||0)).toLocaleString('es-CO'); }
  function M(n){ return (n<0?'-':'') + '$' + (Math.abs(n||0)/1e6).toLocaleString('es-CO',{maximumFractionDigits:1}) + ' M'; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function corto(s){ s=String(s||'').toUpperCase().trim(); return s.indexOf('URAB')>=0 && s.indexOf('TOTAL')<0 ? 'URABÁ' : s; }
  function inicial(s){ return corto(s).charAt(0); }
  function num(s){ var x=String(s||'').replace(/[^\d,.\-]/g,'').replace(/,/g,''); return x?Number(x):0; }
  function pct(s){ var x=parseFloat(String(s||'').replace(',','.')); return isNaN(x)?null:x; }
  function col(tabla, nombre){ return tabla ? tabla.h.indexOf(nombre) : -1; }
  function D(tabla, fila, nombre){ var c=col(tabla,nombre); return c<0?'':fila.d[c]; }
  function V(tabla, fila, nombre){ var c=col(tabla,nombre); if(c<0) return 0; var v=fila.v[c]; return v==null?num(fila.d[c]):v; }
  function claseEstado(t){ t=String(t||''); return t.indexOf('✓')>=0||t.indexOf('🟢')>=0?'p-bien':(t.indexOf('🔴')>=0?'p-mal':'p-ojo'); }

  function grafico(columnas, series, maxV, etiquetaValor){
    // columnas: [{nombre, valores:{serie:valor}}]; series: [[clave,nombre,color]]
    var max = maxV || 0;
    columnas.forEach(function(c){ var t=0; series.forEach(function(s){ t+=c.valores[s[0]]||0; }); if(t>max) max=t; });
    if(!max) max = 1;
    var paso = max/3, ticks='';
    for(var i=0;i<=3;i++) ticks += '<div class="tk" style="bottom:'+(i/3*100)+'%"><span>'+(paso*i/1e6).toLocaleString('es-CO',{maximumFractionDigits:1})+' M</span></div>';
    var bars='';
    columnas.forEach(function(c){
      var seg='', t=0;
      series.slice().reverse().forEach(function(s){ var x=c.valores[s[0]]||0; t+=x; if(x>0) seg+='<div style="height:'+(x/max*170)+'px;background:'+s[2]+'"></div>'; });
      bars += '<div class="bc">'+(etiquetaValor?'<div class="bv">'+M(t)+'</div>':'')+'<div class="bar">'+seg+'</div><div class="bl">'+esc(c.nombre)+'</div></div>';
    });
    var lg = series.length>1 ? '<div class="lg">'+series.map(function(s){return '<span><i style="background:'+s[2]+'"></i>'+s[1]+'</span>';}).join('')+'</div>' : '';
    return '<div class="chart">'+ticks+'<div class="bars">'+bars+'</div></div>'+lg;
  }

  /* ---------- navegación ---------- */
  function ir(t){
    pestana = t;
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-t')===t); });
    ['hoy','semana','mes','detalle'].forEach(function(v){ document.getElementById('v-'+v).classList.toggle('oculto', v!==t); });
    document.getElementById('atras').style.display = 'none';
    document.getElementById('titulo').textContent = {hoy:'VENTA HOY',semana:'SEMANA',mes:'MES'}[t];
    document.getElementById('sub').textContent = t==='hoy'&&HOY ? HOY.fecha : '';
    window.scrollTo(0,0);
    if((t==='semana'||t==='mes') && !RES) cargarResumen();
  }
  function cerrarDetalle(){ ir('hoy'); }

  /* ---------- HOY ---------- */
  function pintarHoy(d){
    HOY = d;
    var t = d.total, h = '';
    if (d.aviso) h += '<div class="alerta">⚠️ '+esc(d.aviso)+'</div>';
    if (d.estado && d.estado !== 'OK') h += '<div class="alerta">⚠️ '+esc(d.estado)+'</div>';
    h += '<div class="card"><div class="meta">Total 4 sedes</div><div class="big">'+$(t.total)+'</div>'
       + '<div class="d">'+(t.tickets||0)+' tickets · Prom. '+$(t.promedio)+' · '+(t.cajas||0)+' cajas abiertas</div></div>';

    var sedes = d.sedes.slice().sort(function(a,b){ return b.total-a.total; });
    h += '<div class="card"><h3>Venta por sede</h3>'
       + grafico(sedes.map(function(s){ return {nombre:corto(s.sede), valores:s}; }),
                 MEDIOS.filter(function(m){ return (t[m[0]]||0)>0; }))
       + '</div>';

    h += '<div class="card lista">';
    sedes.forEach(function(s){
      h += '<div class="it" onclick="detalle(\''+esc(s.sede)+'\')"><div class="av">'+inicial(s.sede)+'</div>'
         + '<div class="tx"><div class="meta">'+esc(corto(s.sede))+'</div><div class="ti">'+$(s.total)+'</div>'
         + '<div class="d">'+(s.tickets||0)+' tickets · Prom. '+$(s.promedio)+'</div></div><div class="ch">›</div></div>';
    });
    h += '</div>';

    h += '<button class="btn" id="btn" onclick="cargarHoy()">🔄 Actualizar</button>'
       + '<div class="pie">Consultado a las '+esc(d.consultado)
       + (d.actualizado ? '<br>Último cambio en la venta: '+esc(d.actualizado) : '')
       + '<br>Se actualiza sola cada 5 minutos mientras esté abierta.</div>';
    document.getElementById('v-hoy').innerHTML = h;
    if (pestana==='hoy') document.getElementById('sub').textContent = d.fecha || '';
  }

  function cargarHoy(){
    if (cargandoHoy) return;
    cargandoHoy = true;
    var b = document.getElementById('btn'); if (b){ b.disabled = true; b.textContent = 'Consultando…'; }
    google.script.run
      .withSuccessHandler(function(d){ cargandoHoy = false; pintarHoy(d); })
      .withFailureHandler(function(e){ cargandoHoy = false;
        document.getElementById('v-hoy').innerHTML = '<div class="error">⚠️ No se pudo cargar la venta: '+esc(e&&e.message||e)+'</div><button class="btn" onclick="cargarHoy()">Intentar de nuevo</button>'; })
      .vhDatos(CLAVE);
  }

  /* ---------- DETALLE DE SEDE ---------- */
  function detalle(nombre){
    if (!HOY) return;
    var s = HOY.sedes.filter(function(x){ return x.sede===nombre; })[0]; if(!s) return;
    var h = '<div class="card"><div class="meta">Venta de hoy</div><div class="big">'+$(s.total)+'</div>'
          + '<div class="d">'+(s.tickets||0)+' tickets · Prom. '+$(s.promedio)+' · '+(HOY.total.total?Math.round(s.total/HOY.total.total*100):0)+'% del día</div></div>';
    h += '<div class="card"><h3>Medios de pago</h3>';
    MEDIOS.forEach(function(m){
      var x = s[m[0]]||0; if(!x && m[0]!=='efectivo' && m[0]!=='transferencia' && m[0]!=='nequi') return;
      var p = s.total ? x/s.total*100 : 0;
      h += '<div class="fila"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:'+m[2]+';margin-right:7px"></i>'+m[1]+'</span><b>'+$(x)+' <small style="color:var(--suave);font-weight:600">· '+Math.round(p)+'%</small></b></div>';
    });
    h += '</div>';
    var cj = HOY.cajas.filter(function(c){ return corto(c.sede)===corto(s.sede); });
    if (cj.length){
      h += '<div class="card"><h3>Cajas</h3>';
      cj.forEach(function(c){
        h += '<div class="fila"><span>'+(c.abierta?'🟢 ':'⚪ ')+esc(c.caja.replace(/^.*?(CAJA\s*\d+)$/i,'$1'))+'</span><b>'+$(c.total)+' <small style="color:var(--suave);font-weight:600">· '+(c.tickets||0)+' tickets</small></b></div>';
      });
      h += '</div>';
    }
    h += '<button class="btn" onclick="sedeSemSel=\''+esc(corto(s.sede))+'\';ir(\'semana\')">📅 Ver la semana de '+esc(corto(s.sede))+'</button>';
    var v = document.getElementById('v-detalle');
    v.innerHTML = h;
    ['hoy','semana','mes'].forEach(function(x){ document.getElementById('v-'+x).classList.add('oculto'); });
    v.classList.remove('oculto');
    document.getElementById('atras').style.display = 'block';
    document.getElementById('titulo').textContent = corto(s.sede);
    document.getElementById('sub').textContent = HOY.fecha || '';
    window.scrollTo(0,0);
  }

  /* ---------- SEMANA y MES ---------- */
  function cargarResumen(){
    if (cargandoRes) return;
    cargandoRes = true;
    google.script.run
      .withSuccessHandler(function(r){ cargandoRes = false; RES = r; pintarSemana(); pintarMes(); })
      .withFailureHandler(function(e){ cargandoRes = false;
        var m = '<div class="error">⚠️ No se pudo cargar: '+esc(e&&e.message||e)+'</div><button class="btn" onclick="cargarResumen()">Intentar de nuevo</button>';
        document.getElementById('v-semana').innerHTML = m; document.getElementById('v-mes').innerHTML = m; })
      .vhResumen(CLAVE);
  }

  function limpiarConclusion(html){
    return String(html||'')
      .replace(/<script[\s\S]*?<\/script>/gi,'').replace(/ on\w+="[^"]*"/gi,'')
      .replace(/color:\s*#444444/gi,'color:#d6d6d6')
      .replace(/#F5C518/gi,'#f5c542').replace(/#FF6B5B/gi,'#ff5252').replace(/#5DCAA5/gi,'#2ecc71');
  }

  function pintarSemana(){
    var T = RES && RES.semana, el = document.getElementById('v-semana');
    if (!T || !T.filas.length){ el.innerHTML = '<div class="card">No hay datos de semanas todavía.</div>'; return; }
    if (!semSel || T.semanas.indexOf(semSel)<0) semSel = T.semanas[0];
    var filas = T.filas.filter(function(f){ return D(T,f,'INICIO')===semSel; });
    var nombres = ['TOTAL 4 SEDES'].concat(filas.map(function(f){ return corto(D(T,f,'SEDE')); }).filter(function(n){ return n!=='TOTAL 4 SEDES'; }));
    if (nombres.indexOf(sedeSemSel)<0) sedeSemSel = 'TOTAL 4 SEDES';
    var f = filas.filter(function(x){ return corto(D(T,x,'SEDE'))===sedeSemSel; })[0];

    var h = '<select onchange="semSel=this.value;pintarSemana()">';
    T.semanas.forEach(function(ini){
      var fx = T.filas.filter(function(x){ return D(T,x,'INICIO')===ini; })[0];
      h += '<option value="'+esc(ini)+'"'+(ini===semSel?' selected':'')+'>'+esc(D(T,fx,'SEMANA')||ini)+'</option>';
    });
    h += '</select><div class="chips">';
    nombres.forEach(function(n){ h += '<button class="chip'+(n===sedeSemSel?' on':'')+'" onclick="sedeSemSel=\''+esc(n)+'\';pintarSemana()">'+(n==='TOTAL 4 SEDES'?'Todas':esc(n))+'</button>'; });
    h += '</div>';

    if (!f){ el.innerHTML = h+'<div class="card">Sin datos para esta sede en esa semana.</div>'; return; }
    var venta = V(T,f,'VENTA SEMANA'), ant = V(T,f,'VENTA SEMANA ANTERIOR'), metaS = V(T,f,'META SEMANAL');
    var variacion = D(T,f,'VARIACIÓN'), pv = pct(variacion), pm = pct(D(T,f,'% META'));
    h += '<div class="card"><div class="meta">'+(sedeSemSel==='TOTAL 4 SEDES'?'Total 4 sedes':esc(sedeSemSel))+'</div>'
       + '<div class="big">'+$(venta)+'</div>'
       + '<div class="d">Semana anterior '+$(ant)+' &nbsp;'+(variacion?'<span class="pill '+(pv>=0?'p-bien':'p-mal')+'">'+(pv>=0?'▲ ':'▼ ')+esc(variacion.replace('-',''))+'</span>':'')+'</div>';
    if (metaS){
      h += '<div class="prog"><div style="width:'+Math.min(100,pm||0)+'%;background:'+((pm||0)>=100?'var(--bien)':'var(--oro)')+'"></div></div>'
         + '<div class="d">'+esc(D(T,f,'% META'))+' de la meta ('+$(metaS)+')</div>';
    }
    h += '</div>';

    var dias = ['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];
    h += '<div class="card"><h3>Venta por día</h3>'
       + grafico(dias.map(function(x){ return {nombre:x.charAt(0)+x.slice(1).toLowerCase(), valores:{v:V(T,f,x)}}; }), [['v','Venta','var(--oro)']], 0, false)
       + '<div class="fila"><span>🏆 Mejor día</span><b>'+esc(D(T,f,'MEJOR DÍA'))+'</b></div>'
       + '<div class="fila"><span>📉 Peor día</span><b>'+esc(D(T,f,'PEOR DÍA'))+'</b></div></div>';

    var pIns = pct(D(T,f,'% INSUMOS')), insOk = pIns==null || pIns<=35;
    h += '<div class="card"><h3>Costos de la semana</h3>'
       + '<div class="sm-i"><div><span class="n">Insumos</span><span class="mt">meta 35%</span></div>'
       + '<div class="sm-box '+(V(T,f,'INSUMOS SEMANA')?(insOk?'sm-bok':'sm-brv'):'sm-b0')+'"><div class="p">'+esc(D(T,f,'% INSUMOS')||'0%')+' '+(insOk?'✓':'⚠')+'</div><div class="a">'+$(V(T,f,'INSUMOS SEMANA'))+'</div></div></div>'
       + '<div class="sm-i"><div><span class="n">Gastos operativos</span><span class="mt">% de la venta</span></div>'
       + '<div class="sm-box sm-b0"><div class="p">'+esc(D(T,f,'% GASTOS OPERATIVOS')||'0%')+'</div><div class="a">'+$(V(T,f,'GASTOS OPERATIVOS SEMANA'))+'</div></div></div>'
       + '<div class="sm-i"><div><span class="n">Gastos personales</span><span class="mt">de la semana</span></div>'
       + '<div class="sm-box sm-b0"><div class="p">'+$(V(T,f,'GASTOS PERSONALES SEMANA'))+'</div></div></div></div>';

    if (sedeSemSel==='TOTAL 4 SEDES'){
      var otras = filas.filter(function(x){ return corto(D(T,x,'SEDE'))!=='TOTAL 4 SEDES'; })
                       .sort(function(a,b){ return V(T,b,'VENTA SEMANA')-V(T,a,'VENTA SEMANA'); });
      h += '<div class="card lista">';
      otras.forEach(function(x){
        var n = corto(D(T,x,'SEDE')), vr = D(T,x,'VARIACIÓN'), p = pct(vr);
        h += '<div class="it" onclick="sedeSemSel=\''+esc(n)+'\';pintarSemana();window.scrollTo(0,0)"><div class="av">'+inicial(n)+'</div>'
           + '<div class="tx"><div class="meta">'+esc(n)+'</div><div class="ti">'+$(V(T,x,'VENTA SEMANA'))+'</div>'
           + '<div class="d">'+esc(D(T,x,'% META'))+' de la meta '+(vr?'· <span style="color:'+(p>=0?'var(--bien)':'var(--mal)')+';font-weight:700">'+(p>=0?'▲ ':'▼ ')+esc(vr.replace('-',''))+'</span>':'')+'</div></div><div class="ch">›</div></div>';
      });
      h += '</div>';
    }

    var alertas = D(T,f,'ALERTAS');
    if (alertas && alertas.indexOf('#N/A')<0) h += '<div class="alerta">⚠️ '+esc(alertas)+'</div>';
    var concl = D(T,f,'CONCLUSIÓN');
    if (concl && concl.indexOf('#N/A')<0) h += '<div class="card"><h3>Análisis</h3><div class="concl">'+limpiarConclusion(concl)+'</div></div>';
    el.innerHTML = h;
  }

  var mesSel = null, sedeMesSel = 'Todas';
  function pintarMes(){
    var T0 = RES && RES.mes, el = document.getElementById('v-mes');
    if (!T0 || !T0.filas.length){ el.innerHTML = '<div class="card">No hay datos del mes todavía.</div>'; return; }

    // Meses disponibles (si algún día hay varios en la hoja)
    var meses = [];
    T0.filas.forEach(function(f){ var m = D(T0,f,'MES'); if (meses.indexOf(m)<0) meses.push(m); });
    if (!mesSel || meses.indexOf(mesSel)<0) mesSel = meses[0];
    var T = { h: T0.h, filas: T0.filas.filter(function(f){ return D(T0,f,'MES')===mesSel; }) };

    var orden = T.filas.slice().sort(function(a,b){ return V(T,b,'INGRESOS')-V(T,a,'INGRESOS'); });
    var nombres = ['Todas'].concat(orden.map(function(f){ return corto(D(T,f,'SEDE')); }));
    if (nombres.indexOf(sedeMesSel)<0) sedeMesSel = 'Todas';

    var h = '';
    if (meses.length > 1){
      h += '<select onchange="mesSel=this.value;pintarMes()">';
      meses.forEach(function(m){ h += '<option value="'+esc(m)+'"'+(m===mesSel?' selected':'')+'>'+esc(m)+'</option>'; });
      h += '</select>';
    }
    h += '<div class="chips">';
    nombres.forEach(function(n){ h += '<button class="chip'+(n===sedeMesSel?' on':'')+'" onclick="sedeMesSel=\''+esc(n)+'\';pintarMes();window.scrollTo(0,0)">'+esc(n)+'</button>'; });
    h += '</div>';

    if (sedeMesSel !== 'Todas'){
      var fs = orden.filter(function(f){ return corto(D(T,f,'SEDE'))===sedeMesSel; })[0];
      el.innerHTML = h + (fs ? tarjetaSedeMes(T, fs) : '<div class="card">Sin datos para esta sede.</div>');
      return;
    }

    var ing=0, egr=0, uti=0, per=0;
    T.filas.forEach(function(f){ ing+=V(T,f,'INGRESOS'); egr+=V(T,f,'EGRESOS'); uti+=V(T,f,'UTILIDAD'); per+=V(T,f,'GASTOS PERSONALES'); });
    var mesNombre = mesSel;
    h += '<div class="card"><div class="meta">Total 4 sedes · '+esc(mesNombre)+'</div><div class="big">'+$(ing)+'</div><div class="d">Ingresos del mes</div>'
          + '<div class="kpis"><div class="kpi"><b>'+M(egr)+'</b><span>Egresos</span></div>'
          + '<div class="kpi"><b style="color:'+(uti>=0?'var(--bien)':'var(--mal)')+'">'+M(uti)+'</b><span>Utilidad</span></div>'
          + '<div class="kpi"><b>'+(ing?(uti/ing*100).toLocaleString('es-CO',{maximumFractionDigits:1}):0)+'%</b><span>Margen neto</span></div></div></div>';

    h += '<div class="card"><h3>Ingresos y utilidad por sede</h3>'
       + grafico(orden.map(function(f){ var u=V(T,f,'UTILIDAD'), i=V(T,f,'INGRESOS'); return {nombre:corto(D(T,f,'SEDE')), valores:{u:Math.max(u,0), g:i-Math.max(u,0)}}; }),
                 [['u','Utilidad','var(--bien)'],['g','Gastos','#444444']], 0, true)
       + '</div>';

    // Lista compacta de sedes: toca una para ver su detalle
    h += '<div class="card lista">';
    orden.forEach(function(f){
      var n = corto(D(T,f,'SEDE')), u = V(T,f,'UTILIDAD'), malos = indsMalos(T,f);
      h += '<div class="it" onclick="sedeMesSel=\''+esc(n)+'\';pintarMes();window.scrollTo(0,0)"><div class="av">'+inicial(n)+'</div>'
         + '<div class="tx"><div class="meta">'+esc(n)+'</div><div class="ti">'+$(V(T,f,'INGRESOS'))+'</div>'
         + '<div class="d">Utilidad <b style="color:'+(u>=0?'var(--bien)':'var(--mal)')+'">'+M(u)+'</b> · '+(malos?'⚠ '+malos+' por revisar':'✓ Todo OK')+'</div></div><div class="ch">›</div></div>';
    });
    h += '</div>';
    el.innerHTML = h;
  }

  function indsDe(T){ return T.h.filter(function(x){ return x.indexOf('ESTADO ')===0 && T.h.indexOf('% REAL '+x.replace('ESTADO ',''))>=0; }).map(function(x){ return x.replace('ESTADO ',''); }); }
  function indsMalos(T,f){ return indsDe(T).filter(function(k){ return String(D(T,f,'ESTADO '+k)).indexOf('✓')<0; }).length; }
  function nombreInd(k){
    var x = {'SERVICIOS PUBLICOS':'Servicios públicos','ADMINISTRACION':'Administración','TOTAL GASTOS OPERATIVOS':'Total gastos op.'}[k];
    return x || (k.charAt(0)+k.slice(1).toLowerCase());
  }
  function metaCorta(s){ return String(s||'').replace('.0%','%'); }

  function tarjetaSedeMes(T, f){
    var inds = indsDe(T), n = corto(D(T,f,'SEDE')), u = V(T,f,'UTILIDAD'), malos = indsMalos(T,f);
    var h = '<div class="sm-card"><div class="sm-top"><div style="display:flex;align-items:center;gap:12px"><div class="av">'+inicial(n)+'</div>'
       + '<div class="tx"><div class="meta">'+esc(n)+' · '+esc(D(T,f,'MES'))+'</div><div class="ti">'+$(V(T,f,'INGRESOS'))+'</div></div></div>'
       + '<span class="pill '+(malos?'p-ojo':'p-bien')+'">'+(malos?'⚠ '+malos+' por revisar':'✓ Todo OK')+'</span></div>'
       + '<div class="sm-k">'
       + '<div><span>Egresos</span><b>'+$(V(T,f,'EGRESOS'))+'</b></div>'
       + '<div><span>Utilidad</span><b style="color:'+(u>=0?'var(--bien)':'var(--mal)')+'">'+$(u)+'</b></div>'
       + '<div><span>Margen neto</span><b>'+esc(D(T,f,'MARGEN NETO'))+'</b></div>'
       + '<div><span>% de gastos</span><b>'+esc(D(T,f,'% GASTOS'))+'</b></div>'
       + '<div><span>Efectivo neto</span><b>'+$(V(T,f,'EFECTIVO NETO'))+'</b></div>'
       + '<div><span>Gastos personales</span><b>'+$(V(T,f,'GASTOS PERSONALES'))+'</b></div>'
       + '</div><div class="sm-h">Indicadores</div>';
    inds.forEach(function(k){
      var real = D(T,f,'% REAL '+k), obj = D(T,f,'% OBJETIVO '+k), est = String(D(T,f,'ESTADO '+k)), monto = V(T,f,k);
      var ok = est.indexOf('✓')>=0, cero = !monto;
      var cls = cero ? 'sm-b0' : (ok ? 'sm-bok' : 'sm-brv');
      h += '<div class="sm-i"><div><span class="n">'+esc(nombreInd(k))+'</span><span class="mt">meta '+esc(metaCorta(obj))+'</span></div>'
         + '<div class="sm-box '+cls+'"><div class="p">'+esc(real==='-'||!real?'0%':real)+' '+(ok?'✓':'⚠')+'</div>'
         + '<div class="a">'+(cero?'sin gasto':$(monto))+'</div></div></div>';
    });
    h += '<div class="sm-pie">Actualizado '+esc(D(T,f,'ÚLTIMA ACTUALIZACIÓN'))+'</div>';
    var link = String(D(T,f,'LINK LIBRO')||'').trim();
    if (/^https:\/\/docs\.google\.com\//.test(link)){
      h += '<a class="btn" href="'+esc(link)+'" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;margin-top:12px">📗 Abrir libro de '+esc(n)+'</a>';
    }
    return h + '</div>';
  }

  /* ---------- arranque ---------- */
  cargarHoy();
  setInterval(function(){ if (!document.hidden && pestana==='hoy') cargarHoy(); }, 5*60*1000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && pestana==='hoy') cargarHoy(); });
</script>
</body>
</html>
