<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gastos Drive</title>
<meta name="theme-color" content="#000000">
<style>
  :root{--negro:#111;--panel:#1c1c1c;--borde:#333;--oro:#d4a017;--rojo:#c62828;--texto:#f5f5f5;--gris:#9e9e9e;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--negro);color:var(--texto);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .app{max-width:480px;margin:0 auto;padding:12px 14px 16px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  #main{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
  #main .card{margin-bottom:0}
  header{text-align:center;padding:2px 0 8px}
  header h1{margin:0;font-size:21px;color:var(--oro);letter-spacing:.5px}
  header p{margin:2px 0 0;color:var(--gris);font-size:13px}
  .card{background:var(--panel);border:1px solid var(--borde);border-radius:14px;padding:14px;margin-bottom:10px}
  .lbl{font-size:13px;color:var(--oro);font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:.6px}
  .sedes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sede{padding:14px 6px;border-radius:12px;border:2px solid var(--borde);background:#222;color:var(--texto);font-size:14px;font-weight:700;cursor:pointer}
  .sede.on{border-color:var(--oro);background:var(--oro);color:#111}
  .fila{display:flex;gap:8px;align-items:center}
  input[type=date],input[type=text],input[type=password]{width:100%;padding:13px 12px;border-radius:10px;border:1px solid var(--borde);background:#111;color:var(--texto);font-size:16px}
  input[type=date]{color-scheme:dark}
  .chip{padding:11px 15px;border-radius:20px;border:1px solid var(--borde);background:#222;color:var(--texto);font-size:14px;white-space:nowrap;cursor:pointer}
  .chip.on{border-color:var(--oro);color:var(--oro)}
  .botones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{display:flex;flex-direction:row;justify-content:center;align-items:center;gap:6px;padding:18px 6px;border-radius:12px;flex-direction:column;border:2px dashed var(--borde);background:#222;color:var(--texto);font-size:14px;font-weight:600;cursor:pointer}
  .btn span{font-size:28px}
  input[type=file]{display:none}
  .previas{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.previas:empty{display:none}
  .prev{position:relative;width:56px;height:56px;border-radius:10px;overflow:hidden;background:#000;border:1px solid var(--borde);display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;color:var(--gris)}
  .prev img{width:100%;height:100%;object-fit:cover}
  .prev b{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:var(--rojo);color:#fff;font-size:14px;line-height:22px;text-align:center;cursor:pointer}
  .enviar{width:100%;padding:18px;border:0;border-radius:12px;background:#f0b90b;color:#000;font-size:17px;font-weight:800;letter-spacing:.5px;cursor:pointer}
  .enviar:disabled{opacity:.45}
  .msg{margin-top:10px;padding:12px;border-radius:10px;font-size:14px;display:none;line-height:1.4}
  .msg.ok{display:block;background:#1b3a1f;border:1px solid #2e7d32}
  .msg.err{display:block;background:#3a1b1b;border:1px solid var(--rojo)}
  .msg a{color:var(--oro)}
  .barra{height:6px;background:#333;border-radius:3px;overflow:hidden;margin-top:12px;display:none}
  .barra i{display:block;height:100%;width:0;background:var(--oro);transition:width .3s}
  #pinView{display:none}

  .verlink{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:6px 14px;border-radius:999px;border:1px solid var(--oro);background:transparent;color:var(--oro);font-size:13px;font-weight:700;cursor:pointer}
  #vistaLista{display:none;min-height:100vh;min-height:100dvh;flex-direction:column}
  body.lista #vistaLista{display:flex}
  body.lista #vistaSubir{display:none}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .atras{border:1px solid var(--borde);background:#222;color:var(--texto);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700;cursor:pointer}
  .top h2{margin:0;font-size:18px;color:var(--oro)}
  .filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
  .filtros::-webkit-scrollbar{display:none}
  .resumen{display:flex;justify-content:space-between;align-items:center;color:var(--gris);font-size:13px;margin:4px 2px 8px}
  .resumen b{color:var(--texto)}
  .items{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--borde);border-radius:12px;padding:8px;cursor:pointer;text-align:left;color:var(--texto);width:100%}
  .item .mini{flex:0 0 58px;height:58px;border-radius:8px;background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:26px}
  .item .info{flex:1;min-width:0}
  .item .t1{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .t2{font-size:12px;color:var(--gris);margin-top:3px}
  .tag{display:inline-block;font-size:11px;font-weight:700;color:#000;background:var(--oro);border-radius:6px;padding:1px 6px;margin-right:6px}
  .vacio{text-align:center;color:var(--gris);padding:30px 10px;font-size:14px}
  .cargando{text-align:center;color:var(--oro);padding:30px 10px;font-size:14px}
  .visor{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;z-index:50}
  .visor.on{display:flex}
  .visor .vtop{display:flex;align-items:center;gap:8px;padding:10px 12px}
  .visor .vtit{flex:1;min-width:0;font-size:13px;color:var(--texto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .visor .vcuerpo{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:8px}
  .visor img{max-width:100%;max-height:100%;object-fit:contain}
  .visor .vpie{display:flex;gap:8px;padding:10px 12px 16px}
  .visor .vpie a,.visor .vpie button{flex:1;text-align:center;padding:12px;border-radius:10px;font-weight:700;font-size:14px;text-decoration:none;border:0;cursor:pointer}

  .seg{display:grid;grid-template-columns:1fr 1fr;background:#1c1c1c;border:1px solid var(--borde);border-radius:999px;padding:3px;margin-bottom:8px}
  .seg button{border:0;background:none;color:var(--gris);font-size:14px;font-weight:700;padding:8px 0;border-radius:999px;cursor:pointer}
  .seg button.on{background:#f0b90b;color:#000}
  .origenes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:8px}
  .origenes button{border:1px solid var(--borde);background:#1c1c1c;color:var(--texto);border-radius:10px;padding:9px 2px;font-size:12px;font-weight:600;cursor:pointer}
  .origenes button.on{border-color:var(--oro);color:var(--oro)}
  .mesnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
  .mesnav button{border:1px solid var(--borde);background:#222;color:var(--oro);border-radius:10px;width:42px;height:36px;font-size:18px;cursor:pointer}
  .mesnav button:disabled{opacity:.3}
  .mesnav b{font-size:16px}
  .tarjetas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .tarjetas div{background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:9px 10px}
  .tarjetas div.am{background:#f0b90b;border-color:#f0b90b;color:#000}
  .tarjetas small{display:block;font-size:12px;opacity:.75}
  .tarjetas b{font-size:19px}
  .gdia{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--borde);padding:8px 2px 5px;margin:6px 0 6px}
  .gdia b{font-size:14px}
  .gdia span{font-size:12px;color:var(--gris)}
  .tagf{background:#1f7a3f;color:#e9fbe9}
  .tagq{background:#7a1f1f;color:#ffe3e3}
  .tags{background:#0c2a4a;color:#85b7eb}
  .item.sopi{background:#0f1724;border-color:#24406e}
  .item .val{font-weight:700;font-size:14px;white-space:nowrap;margin-left:4px}
  .item .val.sinval{font-size:12px;font-weight:600;color:var(--oro);border:1px dashed currentColor;border-radius:6px;padding:3px 7px}
  .bAmarillo{background:#f0b90b;color:#000}
  .bGris{background:#222;color:var(--texto);border:1px solid var(--borde)!important}
</style>
</head>
<body>
<div class="app" id="vistaSubir">
  <header>
    <h1>🍕 GASTOS DRIVE</h1>
    <p>Sube la foto o el archivo del gasto</p>
    <button class="verlink" onclick="abrirLista()">📋 Ver gastos subidos</button>
  </header>

  <div id="main">
    <div class="card">
      <div class="lbl">1. Sede</div>
      <div class="sedes" id="sedes"></div>
    </div>

    <div class="card">
      <div class="lbl">2. Día del gasto</div>
      <div class="fila">
        <button class="chip on" id="cHoy" onclick="ponerDia(0)">Hoy</button>
        <button class="chip" id="cAyer" onclick="ponerDia(-1)">Ayer</button>
        <input type="date" id="fecha" onchange="marcarChips()" style="flex:1;min-width:0">
      </div>
    </div>

    <div class="card">
      <div class="lbl">3. Foto o archivo</div>
      <div class="botones">
        <label class="btn"><span>📷</span>Tomar foto
          <input type="file" accept="image/*" capture="environment" onchange="agregar(this)">
        </label>
        <label class="btn"><span>📎</span>Galería / archivo
          <input type="file" accept="image/*,application/pdf" multiple onchange="agregar(this)">
        </label>
      </div>
      <div class="previas" id="previas"></div>
    </div>

    <div class="card">
      <div class="lbl">4. Nota (opcional)</div>
      <input type="text" id="nota" maxlength="60" placeholder="Ej: gas, verduras, domicilio...">
    </div>

    <button class="enviar" id="btnSubir" onclick="subir()">SUBIR GASTO</button>
    <div class="barra" id="barra"><i></i></div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<div class="app" id="vistaLista">
  <div class="top">
    <button class="atras" onclick="cerrarLista()">‹ Subir</button>
    <h2>Gastos subidos</h2>
  </div>
  <div class="seg" id="lModo"><button data-m="dia" onclick="ponerModo('dia')">Día</button><button data-m="mes" onclick="ponerModo('mes')">Mes</button></div>
  <div class="origenes" id="lOrig">
    <button data-o="todos" onclick="ponerOrigen('todos')">Todos</button>
    <button data-o="familia" onclick="ponerOrigen('familia')">Drive Familia</button>
    <button data-o="cierre" onclick="ponerOrigen('cierre')">Cierre Sede</button>
    <button data-o="soportes" onclick="ponerOrigen('soportes')">Soportes</button>
    <button data-o="quitados" onclick="ponerOrigen('quitados')">Quitados</button>
  </div>
  <div class="filtros" id="lSedes"></div>
  <div class="fila" id="lDiaCtl" style="margin-bottom:8px">
    <button class="chip" id="lHoy" onclick="lDia(0)">Hoy</button>
    <button class="chip" id="lAyer" onclick="lDia(-1)">Ayer</button>
    <input type="date" id="lFecha" onchange="cargarLista()" style="flex:1;min-width:0">
  </div>
  <div class="mesnav" id="lMesCtl"><button id="lMesAnt" onclick="moverMes(-1)">‹</button><b id="lMesTxt"></b><button id="lMesSig" onclick="moverMes(1)">›</button></div>
  <div class="tarjetas" id="lResumen"></div>
  <div class="items" id="lItems"></div>
</div>

<div class="visor" id="visor">
  <div class="vtop"><div class="vtit" id="vTit"></div><button class="atras" onclick="cerrarVisor()">✕ Cerrar</button></div>
  <div class="vcuerpo" id="vCuerpo"></div>
  <div class="vpie" id="vPie"></div>
</div>

<script>
  var archivos = [], preps = [], sede = null;

  function guardar(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function leer(k){try{return localStorage.getItem(k)}catch(e){return null}}

  // ---------- Inicio (sin PIN) ----------
  var URL_GASTOS = 'https://script.google.com/macros/s/AKfycbyFVZ2gIJWzPzyN9uFdqefU1k_HUKTZinj9zI302htDH5qLlDETpGj0-YBNqcBMyr9K4g/exec';
  var SEDES = ['NUESTRO URABÁ','NUESTRO MONTERÍA','ORTÍZ','TURBO'];
  ponerDia(0);
  pintarSedes(SEDES);
  // Despierta a Google apenas se abre la pantalla, para que la primera subida no espere
  try { fetch(URL_GASTOS+'?accion=ping',{credentials:'omit'}).catch(function(){}); } catch(e) {}

  function pintarSedes(lista){
    var cont = document.getElementById('sedes'), ultima = leer('pg_sede');
    cont.innerHTML='';
    lista.forEach(function(s){
      var b=document.createElement('button'); b.className='sede'; b.textContent=s;
      b.onclick=function(){ elegirSede(s); };
      b.dataset.s=s; cont.appendChild(b);
    });
    if (ultima && lista.indexOf(ultima)>-1) elegirSede(ultima);
  }

  function elegirSede(s){
    sede=s; guardar('pg_sede', s);
    document.querySelectorAll('.sede').forEach(function(b){ b.classList.toggle('on', b.dataset.s===s); });
  }

  // ---------- Fecha ----------
  function fechaISO(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function ponerDia(delta){ var d=new Date(); d.setDate(d.getDate()+delta); document.getElementById('fecha').value=fechaISO(d); marcarChips(); }
  function marcarChips(){
    var v=document.getElementById('fecha').value, h=new Date(), a=new Date(); a.setDate(a.getDate()-1);
    document.getElementById('cHoy').classList.toggle('on', v===fechaISO(h));
    document.getElementById('cAyer').classList.toggle('on', v===fechaISO(a));
  }

  // ---------- Archivos ----------
  function agregar(input){
    Array.prototype.forEach.call(input.files, function(f){ archivos.push(f); preps.push(prepararArchivo(f)); }); // se comprime de una vez
    input.value=''; pintarPrevias();
  }
  function quitar(i){ archivos.splice(i,1); preps.splice(i,1); pintarPrevias(); }
  function pintarPrevias(){
    var c=document.getElementById('previas'); c.innerHTML='';
    archivos.forEach(function(f,i){
      var d=document.createElement('div'); d.className='prev';
      if (f.type.indexOf('image/')===0){ var img=document.createElement('img'); img.src=URL.createObjectURL(f); d.appendChild(img); }
      else { d.textContent='📄 '+f.name.slice(0,18); }
      var x=document.createElement('b'); x.textContent='×'; x.onclick=function(){quitar(i)}; d.appendChild(x);
      c.appendChild(d);
    });
  }

  // Reduce fotos grandes a máx. 1600 px (sube más rápido con datos móviles)
  function prepararArchivo(f){
    return new Promise(function(resolve){
      var aBase64 = function(blob, tipo, nombre){
        var r=new FileReader();
        r.onload=function(){ resolve({base64:r.result.split(',')[1], tipo:tipo, nombre:nombre}); };
        r.readAsDataURL(blob);
      };
      if (f.type.indexOf('image/')!==0 || f.type==='image/gif'){ return aBase64(f, f.type, f.name); }
      var img=new Image();
      img.onload=function(){
        var max=1400, w=img.width, h=img.height, k=Math.min(1, max/Math.max(w,h));
        var cv=document.createElement('canvas'); cv.width=Math.round(w*k); cv.height=Math.round(h*k);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        cv.toBlob(function(b){ aBase64(b||f, b?'image/jpeg':f.type, f.name.replace(/\.[^.]+$/,'')+'.jpg'); }, 'image/jpeg', 0.72);
      };
      img.onerror=function(){ aBase64(f, f.type, f.name); };
      img.src=URL.createObjectURL(f);
    });
  }

  // Envía el archivo a Google Apps Script (texto plano para evitar bloqueos del navegador)
  function llamar(datos){
    return fetch(URL_GASTOS, {method:'POST', credentials:'omit', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(datos)})
      .then(function(r){ return r.json(); })
      .then(function(j){ if (!j.ok) throw new Error(j.error || 'Error'); return j.data; });
  }

  // ---------- Subir ----------
  async function subir(){
    var msg=document.getElementById('msg'); msg.className='msg';
    var fecha=document.getElementById('fecha').value;
    if (!sede) return aviso('err','Escoge la sede.');
    if (!fecha) return aviso('err','Escoge el día.');
    if (!archivos.length) return aviso('err','Agrega al menos una foto o archivo.');

    var btn=document.getElementById('btnSubir'), barra=document.getElementById('barra');
    btn.disabled=true; barra.style.display='block';
    var nota=document.getElementById('nota').value, total=archivos.length, res=null;
    try{
      // Sube hasta 3 archivos al mismo tiempo
      var hechos=0, siguiente=0, lista=archivos.slice(), lp=preps.slice();
      btn.textContent='SUBIENDO 0 DE '+total+'...';
      async function trabajador(){
        while (siguiente < total){
          var i=siguiente++;
          var p=await (lp[i] || prepararArchivo(lista[i]));
          var r=await llamar({sede:sede, fecha:fecha, nota:nota, nombre:p.nombre, tipo:p.tipo, base64:p.base64, n:i+1, total:total});
          res=res||r; hechos++;
          btn.textContent='SUBIENDO '+hechos+' DE '+total+'...';
          barra.firstElementChild.style.width=Math.round(hechos/total*100)+'%';
        }
      }
      var workers=[]; for (var k=0;k<Math.min(3,total);k++) workers.push(trabajador());
      await Promise.all(workers);
      aviso('ok','✅ '+total+(total>1?' archivos subidos':' archivo subido')+' a:<br><b>'+res.ruta+'</b><br><a href="#" onclick="abrirLista();return false">Ver gastos de ese día</a>');
      archivos=[]; preps=[]; pintarPrevias(); document.getElementById('nota').value='';
    }catch(e){
      aviso('err','❌ No se pudo subir: '+(e && e.message ? e.message : e)+'. Revisa la señal e intenta de nuevo.');
    }
    btn.disabled=false; btn.textContent='SUBIR GASTO';
    setTimeout(function(){ barra.style.display='none'; barra.firstElementChild.style.width='0'; }, 800);
  }


  // ---------- Lista de gastos subidos (Día / Mes · Drive Familia + Cierre Sede) ----------
  var lSede = 'TODAS', lPide = 0, lModo = 'dia', lOrigen = 'todos', lMes = fechaISO(new Date()).slice(0,7);
  var MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  try { lModo = localStorage.getItem('pg_l_modo') || 'dia'; lOrigen = localStorage.getItem('pg_l_origen') || 'todos'; } catch(e) {}
  function abrirLista(){
    lSede = sede || 'TODAS';
    document.getElementById('lFecha').value = document.getElementById('fecha').value || fechaISO(new Date());
    lMes = fechaISO(new Date()).slice(0,7);
    pintarFiltros();
    document.body.classList.add('lista'); window.scrollTo(0,0);
    cargarLista();
  }
  function cerrarLista(){ document.body.classList.remove('lista'); window.scrollTo(0,0); }
  function ponerModo(m){ lModo = m; guardar('pg_l_modo', m); pintarFiltros(); cargarLista(); }
  function ponerOrigen(o){ lOrigen = o; guardar('pg_l_origen', o); pintarFiltros(); cargarLista(); }
  function moverMes(d){ var a = +lMes.slice(0,4), m = +lMes.slice(5,7) + d; if (m < 1){ m = 12; a--; } if (m > 12){ m = 1; a++; } lMes = a + '-' + ('0'+m).slice(-2); pintarFiltros(); cargarLista(); }
  function pintarFiltros(){
    document.querySelectorAll('#lModo button').forEach(function(b){ b.classList.toggle('on', b.dataset.m === lModo); });
    document.querySelectorAll('#lOrig button').forEach(function(b){ b.classList.toggle('on', b.dataset.o === lOrigen); });
    document.getElementById('lDiaCtl').style.display = lModo === 'dia' ? 'flex' : 'none';
    document.getElementById('lMesCtl').style.display = lModo === 'mes' ? 'flex' : 'none';
    document.getElementById('lMesTxt').textContent = MESES_L[+lMes.slice(5,7)-1].replace(/^./, function(c){ return c.toUpperCase(); }) + ' ' + lMes.slice(0,4);
    document.getElementById('lMesSig').disabled = lMes >= fechaISO(new Date()).slice(0,7);
    var c=document.getElementById('lSedes'); c.innerHTML='';
    ['TODAS'].concat(SEDES).forEach(function(s){
      var b=document.createElement('button'); b.className='chip'+(s===lSede?' on':''); b.textContent= s==='TODAS'?'Todas':s;
      b.onclick=function(){ lSede=s; pintarFiltros(); cargarLista(); }; c.appendChild(b);
    });
  }
  function lDia(delta){ var d=new Date(); d.setDate(d.getDate()+delta); document.getElementById('lFecha').value=fechaISO(d); cargarLista(); }
  function marcarLChips(){
    var v=document.getElementById('lFecha').value, h=new Date(), a=new Date(); a.setDate(a.getDate()-1);
    document.getElementById('lHoy').classList.toggle('on', v===fechaISO(h));
    document.getElementById('lAyer').classList.toggle('on', v===fechaISO(a));
  }
  function diaLargo(iso){ var p=iso.split('-'), d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); var t=new Intl.DateTimeFormat('es-CO',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long'}).format(d).replace(',',''); return t.charAt(0).toUpperCase()+t.slice(1); }
  function pesos(n){ return '$' + Math.round(n||0).toLocaleString('es-CO'); }
  var lCache = {};
  function cargarLista(){
    marcarLChips();
    var cont=document.getElementById('lItems'), res=document.getElementById('lResumen');
    var mes, dia = '';
    if (lModo === 'dia'){ var f=document.getElementById('lFecha').value; if(!f) return; mes=f.slice(0,7); dia=String(+f.slice(8,10)); } else mes=lMes;
    var sedes = lSede==='TODAS' ? SEDES : [lSede], origs = lOrigen==='todos' ? ['familia','cierre'] : lOrigen==='soportes' ? ['cierre'] : [lOrigen];
    var mio = ++lPide;
    cont.innerHTML='<div class="cargando">Buscando gastos…</div>'; res.innerHTML='';
    var pedidos=[]; sedes.forEach(function(s){ origs.forEach(function(o){
      var k=o+'|'+s+'|'+mes+'|'+dia;
      pedidos.push(lCache[k] ? Promise.resolve(lCache[k]) : fetch(URL_GASTOS+'?accion=listarOrigen&origen='+o+'&sede='+encodeURIComponent(s)+'&mes='+mes+(dia?'&dia='+dia:''),{credentials:'omit'})
        .then(function(r){ return r.json(); }).then(function(j){ if(!j.ok) throw new Error(j.error||'Error'); lCache[k]=j.data; setTimeout(function(){ delete lCache[k]; }, 120000); return j.data; }));
    }); });
    Promise.all(pedidos).then(function(partes){
      if (mio!==lPide) return;
      var lista=[].concat.apply([], partes);
      if (lOrigen==='soportes') lista=lista.filter(function(x){ return x.soporte; });
      else if (lOrigen==='cierre') lista=lista.filter(function(x){ return !x.soporte; });
      lista.sort(function(a,b){ return a.fecha<b.fecha?1:a.fecha>b.fecha?-1:b.creado-a.creado; });
      // Los gastos pagados por Nequi (pago==='nequi') van aparte: no salen de caja ni entran al total de caja
      var total=0, conValor=0, nGastos=0, totNq=0, nNq=0; lista.forEach(function(x){ if(x.soporte) return; if(x.pago==='nequi'){ nNq++; if(x.valor>0) totNq+=x.valor; return; } nGastos++; if(x.valor>0){ total+=x.valor; conValor++; } });
      res.innerHTML= lOrigen==='soportes' ? '<div><small>Soportes '+(lModo==='mes'?'del mes':'del día')+'</small><b>'+lista.length+'</b></div><div><small>Cierres / saldos Nequi</small><b>'+lista.filter(function(x){return x.soporte==='cierre';}).length+' / '+lista.filter(function(x){return x.soporte==='nequi';}).length+'</b></div>' : '<div><small>'+(lModo==='mes'?'Gastos del mes':'Gastos del día')+'</small><b>'+nGastos+'</b></div><div class="am"><small>Total con valor ('+conValor+')</small><b>'+pesos(total)+'</b></div>'+(nNq?'<div><small>Gastos Nequi ('+nNq+')</small><b style="color:#b48ce8">'+pesos(totNq)+'</b></div>':'');
      cont.innerHTML='';
      if(!lista.length){ cont.innerHTML='<div class="vacio">No hay gastos '+(lModo==='mes'?'en ese mes':'ese día')+(lSede==='TODAS'?'':' en '+lSede)+'.</div>'; return; }
      var grupos={}, orden=[]; lista.forEach(function(x){ if(!grupos[x.fecha]){ grupos[x.fecha]=[]; orden.push(x.fecha); } grupos[x.fecha].push(x); });
      orden.forEach(function(fe){
        var g=grupos[fe], suma=0, ng=0, sNq=0, nNqD=0; g.forEach(function(x){ if(x.soporte) return; if(x.pago==='nequi'){ nNqD++; if(x.valor>0) sNq+=x.valor; return; } ng++; if(x.valor>0) suma+=x.valor; });
        var hd=document.createElement('div'); hd.className='gdia';
        var hb=document.createElement('b'); hb.textContent=diaLargo(fe); var hs=document.createElement('span'); var ns=g.length-ng-nNqD; hs.textContent=(ng?ng+(ng===1?' gasto':' gastos')+(suma?' · '+pesos(suma):''):'')+(nNqD?(ng?' · ':'')+'Nequi '+pesos(sNq):'')+(ns?((ng||nNqD)?' · ':'')+ns+(ns===1?' soporte':' soportes'):'');
        hd.appendChild(hb); hd.appendChild(hs); cont.appendChild(hd);
        g.forEach(function(it){
          var b=document.createElement('button'); b.className='item'+(it.soporte?' sopi':''); b.style.marginBottom='6px';
          var m=document.createElement('div'); m.className='mini';
          if(it.thumb) m.style.backgroundImage='url(data:image/png;base64,'+it.thumb+')';
          else m.textContent = it.tipo==='application/pdf' ? '📄' : (it.tipo.indexOf('image/')===0 ? '🧾' : '📎');
          var inf=document.createElement('div'); inf.className='info';
          var t1=document.createElement('div'); t1.className='t1'; t1.textContent=it.nota||'Gasto';
          var t2=document.createElement('div'); t2.className='t2';
          var tag=document.createElement('span'); tag.className='tag'+(it.soporte?' tags':it.origen==='familia'?' tagf':it.origen==='quitados'?' tagq':''); tag.textContent= it.soporte ? 'Soporte'+(it.caja?' · Caja '+it.caja:'') : it.origen==='familia' ? 'Drive Familia' : it.origen==='quitados' ? 'Quitado'+(it.quitado?' '+it.quitado.slice(11):'') : it.pago==='nequi' ? '💜 Pagado por Nequi' : 'Cierre Sede'+(it.caja?' · Caja '+it.caja:''); if(it.pago==='nequi'){ tag.style.background='#2a1f3d'; tag.style.color='#d9c7ff'; } t2.appendChild(tag);
          t2.appendChild(document.createTextNode(it.sede+' · '+it.hora));
          inf.appendChild(t1); inf.appendChild(t2);
          var v=document.createElement('div'); v.className='val';
          var editable = (it.origen==='familia' || it.origen==='cierre') && it.soporte!=='cierre';
          if (it.soporte==='cierre') { v.textContent='no suma'; v.style.color='#85b7eb'; v.style.fontSize='12px'; }
          else if (it.soporte==='nequi') { if (it.saldo>0) { v.textContent=pesos(it.saldo); v.style.color='#85b7eb'; } else { v.textContent='poner saldo'; v.className='val sinval'; } }
          else if (it.valor>0) { v.textContent = pesos(it.valor); if (it.pago==='nequi') v.style.color='#b48ce8'; }
          else if (editable) { v.textContent='poner valor'; v.className='val sinval'; }
          else { v.textContent='—'; v.style.color='var(--gris)'; }
          if (editable) v.onclick=function(ev){ ev.stopPropagation(); ponerValorItem(it); };
          b.appendChild(m); b.appendChild(inf); b.appendChild(v);
          b.onclick=function(){ abrirVisor(it); }; cont.appendChild(b);
        });
      });
    }).catch(function(e){ if(mio===lPide) cont.innerHTML='<div class="vacio">No se pudo cargar: '+(e.message||e)+'. Revisa la señal y vuelve a tocar el filtro.</div>'; });
  }
  function ponerValorItem(it){
    var nq = it.soporte==='nequi', cur = nq ? it.saldo : it.valor;
    var v = prompt((nq ? 'Saldo Nequi' : 'Valor del gasto "' + (it.nota || 'Gasto') + '"') + ' (solo números):', cur > 0 ? cur : '');
    if (v == null) return; v = String(v).replace(/[^\d]/g, ''); if (!v) return;
    fetch(URL_GASTOS + '?accion=valor&id=' + encodeURIComponent(it.id) + '&v=' + v, {credentials:'omit'}).then(function(r){ return r.json(); })
      .then(function(j){ if (!j.ok) throw new Error(j.error || 'Error'); lCache = {}; cargarLista(); })
      .catch(function(e){ alert('No se guardó el valor: ' + (e.message || e) + '. Revisa el internet e intenta otra vez.'); });
  }
  var vBlobUrl=null;
  function abrirVisor(it){
    var v=document.getElementById('visor'), c=document.getElementById('vCuerpo'), pie=document.getElementById('vPie');
    document.getElementById('vTit').textContent = it.sede+' · '+it.hora+' · '+(it.nota||'Gasto');
    c.innerHTML='<div class="cargando">Abriendo…</div>'; pie.innerHTML=''; v.classList.add('on');
    fetch(URL_GASTOS+'?accion=ver&id='+encodeURIComponent(it.id), {credentials:'omit'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j.ok) throw new Error(j.error||'Error');
        var bin=atob(j.data.base64), arr=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
        if(vBlobUrl) URL.revokeObjectURL(vBlobUrl);
        vBlobUrl=URL.createObjectURL(new Blob([arr],{type:j.data.tipo}));
        c.innerHTML='';
        if(j.data.tipo.indexOf('image/')===0){ var img=document.createElement('img'); img.src=vBlobUrl; c.appendChild(img); }
        else { c.innerHTML='<div class="vacio">📄 '+(j.data.tipo==='application/pdf'?'Archivo PDF':'Archivo')+'<br>Tócalo abajo para abrirlo.</div>'; }
        var a1=document.createElement('a'); a1.className='bAmarillo'; a1.href=vBlobUrl; a1.download=j.data.nombre; a1.textContent= j.data.tipo.indexOf('image/')===0 ? 'Descargar' : 'Abrir / descargar'; pie.appendChild(a1);
        var a2=document.createElement('a'); a2.className='bGris'; a2.href=j.data.url; a2.target='_blank'; a2.rel='noopener'; a2.textContent='Ver en Drive'; pie.appendChild(a2);
      })
      .catch(function(e){ c.innerHTML='<div class="vacio">No se pudo abrir: '+(e.message||e)+'</div>'; });
  }
  function cerrarVisor(){ document.getElementById('visor').classList.remove('on'); document.getElementById('vCuerpo').innerHTML=''; }

  function aviso(tipo, html){ var m=document.getElementById('msg'); m.className='msg '+tipo; m.innerHTML=html; }
</script>
