<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pizza Gourmet · Sede</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mi sede">
<link rel="icon" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://script.google.com">
<style>
/* Página del personal de cada sede: Cuadres (sin plata), Incentivos y Saldo. Negro y amarillo. */
:root{
  --bg:#000; --card:#161616; --card2:#0f0f0f; --line:#262626; --edge:#2e2e2e;
  --txt:#f5f5f5; --mut:#9b9b9b; --yel:#f0b90b; --yel-soft:#1d1a0d; --yel-bar:#ffd84d;
  --grn:#1fe01f; --grn-track:#16240f; --yel-track:#2a2510; --ok:#2ecc71; --ok-bg:#0f2417; --bad:#ff5252;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--txt);font-family:var(--f);font-size:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:#000;border-bottom:1px solid var(--line);display:grid;grid-template-columns:40px 1fr 40px;align-items:center;min-height:56px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
header h1{margin:0;text-align:center;font-size:17px;font-weight:700;letter-spacing:.3px}
.ib{background:none;border:0;color:var(--yel);font-size:22px;width:40px;height:40px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:16px;padding-bottom:110px;display:flex;flex-direction:column;gap:14px}
.marca{display:flex;justify-content:center;padding:6px 0}
.marca img{height:70px;width:auto}
.box{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:14px}
.lbl{color:var(--yel);font-size:13px;font-weight:700;letter-spacing:.4px}
.sub{color:var(--mut);font-size:14px;margin-top:4px;line-height:1.4}
.sec{font-size:20px;font-weight:700;margin:6px 0 0}
.cierre{display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.cierre .fl{margin-left:auto;color:var(--mut);font-size:20px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{color:var(--yel);font-weight:600;font-size:14px;text-align:right;padding:6px 0 6px 6px}
td{padding:8px 0 8px 6px;font-size:14px;font-weight:700;text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left;color:var(--yel);font-weight:600;padding-left:0}
td.mal{color:#ff6b6b} td.med{color:#f5c542}
.tres{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.tres div{color:var(--yel);font-size:14px;font-weight:600} .tres b{display:block;color:var(--txt);font-size:18px;margin-top:4px}
.cierre:last-child{border-bottom:0}
.check{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-weight:800}
.cierre b{display:block;font-size:15px}
.cierre small{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .k{color:var(--mut)} .row .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .t{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.bar .t span:last-child{color:var(--mut);font-weight:500}
.track{height:10px;border-radius:6px;background:var(--grn-track);overflow:hidden}
.track .fill{height:100%;border-radius:6px;background:var(--grn)}
.track.y{background:var(--yel-track)} .track.y .fill{background:var(--yel-bar)}
.reglas{color:var(--mut);font-size:14px;line-height:1.6} .reglas b{color:var(--txt)}
.niveles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.niveles div{background:var(--card2);border:1px solid var(--edge);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:var(--mut)}
.niveles div b{display:block;color:var(--txt);font-size:13px;margin-top:2px}
.niveles div.on{border-color:var(--yel);background:var(--yel-soft)} .niveles div.on b{color:var(--yel)}
.big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.conteos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.conteos button{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--yel);font-weight:700;text-align:center}
.conteos button span{font-size:30px}
.nuevo{display:block;width:100%;background:var(--yel);color:#111;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;cursor:pointer}
label{display:block;color:var(--mut);font-size:13px;font-weight:600;margin-bottom:6px}
select,input,textarea{width:100%;background:var(--card2);border:1px solid var(--edge);color:var(--txt);border-radius:12px;padding:12px;font:inherit}
select:focus,input:focus,textarea:focus{outline:2px solid var(--yel);outline-offset:1px}
.prods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod label{color:var(--txt);font-weight:500;min-height:2.4em;display:flex;align-items:flex-end}
.prod input{text-align:center;font-size:20px;font-weight:700;padding:10px}
.msg{border-radius:12px;padding:12px 14px;font-weight:600}
.msg.ok{background:var(--ok-bg);color:#c9f2d8} .msg.bad{background:#2a1010;color:#ffd0d0}
.aviso{text-align:center;color:var(--mut);padding:30vh 10px 0}
.spin{width:18px;height:18px;border:2px solid #444;border-top-color:var(--yel);border-radius:50%;animation:g 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes g{to{transform:rotate(360deg)}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#000;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:#8a8a8a;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;cursor:pointer;flex:1}
nav button span{font-size:22px}
.rep-btn{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:16px;cursor:pointer;text-align:left}
.rep-btn .ic{font-size:30px;flex:none}
.rep-btn b{display:block;color:var(--yel);font-size:17px}
.rep-btn small{display:block;color:var(--mut);font-size:13px;margin-top:3px}
.rep-btn .fl{margin-left:auto;color:var(--mut);font-size:22px}
.rep-it{border-bottom:1px solid var(--line);padding:12px 0}
.rep-it:last-child{border-bottom:0}
.rep-it b{display:block;font-size:15px}
.rep-it small{color:var(--mut);font-size:13px}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.fotos a{display:block;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--card2);border:1px solid var(--edge)}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
nav button.on{color:var(--yel)}

/* ---------- Gastos ---------- */
#btnRef{font-size:15px;width:30px;height:30px;border:1px solid #333;border-radius:50%;justify-self:end;padding:0;line-height:1}
.g-ruta{text-align:center;color:var(--mut);font-size:12px}
.g-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.g-hoy{border:1px solid var(--yel);color:var(--yel);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.g-caja{border:1px solid #3a3a3a;background:#161616;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:700;cursor:pointer}
.g-caja.on{background:var(--yel);border-color:var(--yel);color:#000}
.g-bot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g-btn{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0;border:2px dashed #3a3a3a;border-radius:16px;background:var(--card);padding:16px 6px;color:var(--txt);font-size:15px;font-weight:600;cursor:pointer}
.g-btn span{font-size:28px}
.g-btn input{display:none}
.g-prev{display:flex;flex-wrap:wrap;gap:8px}
.g-prev div{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:#000;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut);text-align:center}
.g-prev img{width:100%;height:100%;object-fit:cover}
.g-prev button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:#c62828;color:#fff;font-size:14px;line-height:22px;padding:0;cursor:pointer}
.g-cab{display:flex;justify-content:space-between;align-items:baseline}
.g-cab .lbl{font-size:14px}
.g-cab small{color:var(--mut);font-size:13px}
.g-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 0;text-align:left;cursor:pointer}
.g-item:last-child{border-bottom:0}
.g-mini{flex:0 0 46px;height:46px;border-radius:8px;background:#2a2a2a center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:22px}
.g-inf{flex:1;min-width:0}
.g-inf b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-inf small{color:var(--mut);font-size:12px}
.g-val{font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.g-sin{color:var(--yel);border:1px dashed var(--yel);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.g-total{display:flex;justify-content:space-between;align-items:center;background:var(--yel);color:#000;border-radius:14px;padding:12px 16px}
.g-total b{font-size:22px;font-variant-numeric:tabular-nums}
.g-total small{display:block;font-size:12px;font-weight:600}
.g-visor{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.95);display:none;flex-direction:column}
.g-visor.on{display:flex}
.g-visor .vt{display:flex;align-items:center;gap:8px;padding:12px;padding-top:max(12px,env(safe-area-inset-top))}
.g-visor .vt div{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-visor .vc{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:8px}
.g-visor .vc img{max-width:100%;max-height:100%;object-fit:contain}
.g-visor .vp{display:flex;gap:8px;padding:12px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.g-visor .vp a{flex:1;text-align:center;padding:13px;border-radius:12px;font-weight:700;text-decoration:none}
.g-x{background:#222;border:1px solid #333;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header><span id="izq"></span><h1 id="titulo">PIZZA GOURMET</h1><button class="ib" id="btnRef" type="button" aria-label="Actualizar">⟳</button></header>
<main id="app"><div class="aviso"><span class="spin"></span>Cargando…</div></main>
<nav id="nav">
  <button type="button" class="on" data-tab="cuadres"><span>✅</span>Cuadres</button>
  <button type="button" data-tab="incentivos"><span>🎯</span>Incentivos</button>
  <button type="button" data-tab="reportes"><span>🗂️</span>Reportes</button>
  <button type="button" data-tab="gastos"><span>🧾</span>Gastos</button>
</nav>
<script>
(function(){
var API = 'https://script.google.com/macros/s/AKfycbxeMQTA7DAGUlJWcIADlGssk9aUMEKJDcO53lU0syVqesnWAA4UnS_GrLYwajNeVfqb/exec';
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } }
var q = new URLSearchParams(location.search);
var SEDE = (q.get('s') || ls('pg_sede_id')).toUpperCase(), CLAVE = q.get('k') || ls('pg_sede_k');
if (q.get('s')) ls('pg_sede_id', SEDE); if (q.get('k')) ls('pg_sede_k', CLAVE);
var D = null, tab = 'cuadres', pantalla = '', idxConteo = -1, idxCierre = -1, leyendo = false;
var form = {cajero: ls('pg_sede_cajero'), valores: {}, nota: '', enviando: false, msg: null, sel: {ingredientes: [], insumos: []}};
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var NIVELES = [[90, 35000, '90–95,9%'], [96, 65000, '96–99,9%'], [100, 130000, '100–110,9%'], [111, 150000, '111% o más']];
function premio(p){ var m = 0; NIVELES.forEach(function(n){ if (p >= n[0]) m = n[1]; }); return m; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function $m(n){ return '$' + Math.round(n||0).toLocaleString('es-CO'); }
function fechaLarga(iso){ var p = iso.split('-'), d = new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); return DIAS[d.getUTCDay()] + ', ' + (+p[2]) + ' de ' + MESES[+p[1]-1] + ' de ' + p[0]; }
function barra(t, p, y){ return '<div class="bar"><div class="t"><span>' + t + '</span><span>' + p.toFixed(1) + '%</span></div><div class="track' + (y?' y':'') + '"><div class="fill" style="width:' + Math.min(Math.max(p,0),100) + '%"></div></div></div>'; }
function fila(k, v){ return '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }
function app(h){ var y = window.scrollY; document.getElementById('app').innerHTML = h; window.scrollTo(0, y); }
function cab(t, volver){ document.getElementById('titulo').textContent = t; document.getElementById('izq').innerHTML = volver ? '<button class="ib" type="button" data-a="volver" aria-label="Volver">←</button>' : ''; }

/* ---------- Saldo: conteos guardados ---------- */
function conteos(){
  var v = D.saldo || []; if (v.length < 2) return {cab:[], filas:[]};
  var c = v[0].map(function(x){ return String(x||'').trim(); }), cn = c.map(function(x){ return x.toUpperCase(); }), iF = cn.indexOf('FECHA');
  var filas = v.slice(1).filter(function(r){ return r.some(function(x){ return String(x||'').trim(); }); }).map(function(r){
    var t = iF >= 0 ? String(r[iF]||'') : '', d = /^\d{4}-\d{2}-\d{2}T/.test(t) ? new Date(t) : null;
    return {r:r, k:d && !isNaN(d) ? d.toISOString() : t, d:d && !isNaN(d) ? d : null, solo:/T00:00:00/.test(t), t:t};
  });
  filas.sort(function(a,b){ return a.k < b.k ? 1 : a.k > b.k ? -1 : 0; });
  return {cab:c, filas:filas.slice(0, 12)}; // Solo los últimos 12 conteos
}
function fechaConteo(f, larga){
  if (!f.d) return f.t || 'Sin fecha';
  var o = f.solo ? {timeZone:'UTC', day:'2-digit', month:'2-digit', year:'numeric'} : {timeZone:'America/Bogota', day:'2-digit', month:'2-digit', year:'numeric', hour:'numeric', minute:'2-digit'};
  if (larga) o.weekday = 'long';
  return new Intl.DateTimeFormat('es-CO', o).format(f.d);
}

/* ---------- Reportes: un botón por formulario de Tally (para agregar otro, súmalo aquí) ---------- */
var REPORTES = [
  {n:'Saldo', ic:'📦', tab:'saldo', d:'Conteo diario de queso, estirados y bandejas'},
  {n:'Lista de pedidos', ic:'📋', tab:'lista', d:'Lo que hace falta en la sede'},
  {n:'Saneamiento Básico', ic:'🧼', f:'RWxWjJ', d:'Temperatura de refrigeración y plan de saneamiento'},
  {n:'Novedades de nómina', ic:'📝', f:'gbjQxN', p:'Sede', solo:true, d:'Incapacidades, permisos, préstamos y demás novedades'}
];
function fechaHoyBox(){ var f = new Intl.DateTimeFormat('es-CO', {timeZone:'America/Bogota', weekday:'long', day:'numeric', month:'long', year:'numeric'}).format(new Date()); return '<div><label>FECHA</label><div class="box" style="padding:12px;font-weight:700;text-transform:capitalize">📅 ' + esc(f) + '</div></div>'; }
function hoyTxt(){ return new Intl.DateTimeFormat('es-CO', {timeZone:'America/Bogota', day:'2-digit', month:'2-digit', year:'numeric'}).format(new Date()); }
function abrirRep(r){ window.open('https://tally.so/r/' + r.f + '?' + (r.p || 'sede') + '=' + encodeURIComponent(nombreSede()) + '&fecha=' + encodeURIComponent(hoyTxt()), '_blank'); }
var repSel = -1;
function nombreSede(){ return {URABA:'Nuestro Urabá', MONTERIA:'Montería', ORTIZ:'Ortíz', TURBO:'Turbo'}[SEDE] || D.nombre || ''; }
function repsDe(r){ return (D.reportes || []).filter(function(x){ return x.tipo === r.n; }); }
function fechaRep(t){ return /^\d{4}-\d{2}-\d{2}$/.test(t) ? fechaLarga(t) : (t || 'Sin fecha'); }
function pReportes(){
  cab('REPORTES ' + D.nombre.toUpperCase(), false);
  var h = '<div class="sub">Toca un reporte para enviarlo o ver los que ya se mandaron.</div>';
  REPORTES.forEach(function(r, i){
    var l = repsDe(r), u = l[0];
    h += '<button class="rep-btn" type="button" data-rep="' + i + '"><span class="ic">' + r.ic + '</span><span><b>' + esc(r.n) + '</b><small>'
       + (r.tab === 'saldo' ? (function(){ var c = conteos().filas[0]; return c ? 'Último: ' + esc(fechaConteo(c)) : esc(r.d); })() : r.tab ? esc(r.d) : r.solo ? esc(r.d) : u ? 'Último: ' + esc(fechaRep(u.fecha)) + ' · ' + l.length + ' enviado' + (l.length === 1 ? '' : 's') : esc(r.d)) + '</small></span><span class="fl">›</span></button>';
  });
  return h;
}
function pReporte(){
  var r = REPORTES[repSel]; cab(r.n.toUpperCase(), true);
  var l = repsDe(r);
  var h = '<button class="nuevo" type="button" data-a="enviarRep">📤 Enviar reporte de ' + esc(r.n) + '</button>'
        + '<div class="sub">Se abre el formulario. Al terminar, vuelve aquí y toca ⟳ para verlo en la lista.</div>'
        + '<div class="sec">Enviados ' + r.ic + '</div>';
  if (!l.length) return h + '<div class="box"><div class="sub">Todavía no hay reportes de ' + esc(D.nombre) + '.</div></div>';
  return h + '<div class="box">' + l.map(function(x){
    return '<div class="rep-it"><b>' + esc(fechaRep(x.fecha)) + '</b><small>' + esc(x.quien || 'Sin nombre') + ' · enviado ' + esc(x.recibido) + '</small>'
      + (x.obs ? '<div class="sub">' + esc(x.obs) + '</div>' : '')
      + (x.fotos.length ? '<div class="fotos">' + x.fotos.map(function(u){ return /^https:\/\//.test(u) ? '<a href="' + esc(u) + '" target="_blank" rel="noopener"><img src="' + esc(u) + '" alt="Planilla" loading="lazy"></a>' : ''; }).join('') + '</div>' : '')
      + '</div>';
  }).join('') + '</div>';
}


/* ---------- Gastos: fotos de gastos del día a la carpeta CIERRE (Día de hoy / CAJA # n) ---------- */
var API_G = 'https://script.google.com/macros/s/AKfycbyFVZ2gIJWzPzyN9uFdqefU1k_HUKTZinj9zI302htDH5qLlDETpGj0-YBNqcBMyr9K4g/exec';
var NOMBRE_G = {URABA:'NUESTRO URABÁ', MONTERIA:'NUESTRO MONTERÍA', ORTIZ:'ORTÍZ', TURBO:'TURBO'};
var MESES_G = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
var G = {caja: ls('pg_g_caja') || '1', archivos: [], preps: [], urls: [], nota: '', subiendo: '', msg: null, lista: null, cargando: false, err: '', pend: [], activos: 0};
function hoyG(){ var t = new Intl.DateTimeFormat('en-CA', {timeZone:'America/Bogota', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date()).split('-'); return {a:+t[0], m:+t[1], d:+t[2]}; }
function hoyCorto(){ var t = new Intl.DateTimeFormat('es-CO', {timeZone:'America/Bogota', weekday:'long', day:'numeric', month:'long'}).format(new Date()).replace(',', ''); return t.charAt(0).toUpperCase() + t.slice(1); }
function gPrep(f){
  return new Promise(function(res){
    var b64 = function(blob, tipo, nombre){ var r = new FileReader(); r.onload = function(){ res({base64: r.result.split(',')[1], tipo: tipo, nombre: nombre}); }; r.readAsDataURL(blob); };
    if (f.type.indexOf('image/') !== 0 || f.type === 'image/gif') return b64(f, f.type, f.name);
    var img = new Image();

  [['ingredientes','INGREDIENTES'],['insumos','INSUMOS']].forEach(function(g){
    var ops = D[g[0]] || []; if (!ops.length) return;
    h += '<div style="color:var(--yel);font-weight:800;margin:14px 0 6px">' + g[1] + '</div><div style="display:flex;flex-wrap:wrap;gap:8px">' + ops.map(function(o){
      var on = form.sel[g[0]].indexOf(o) >= 0;
      return '<button type="button" data-chip="' + g[0] + '" data-v="' + esc(o) + '" style="padding:9px 12px;border-radius:999px;border:1px solid ' + (on ? 'var(--yel)' : '#444') + ';background:' + (on ? 'var(--yel)' : '#1a1a1a') + ';color:' + (on ? '#000' : '#eee') + ';font-weight:' + (on ? '800' : '500') + ';font-size:15px">' + esc(o) + '</button>';
    }).join('') + '</div>';
  });
  h += '<div style="margin-top:14px"><label for="nota">NOTA (OPCIONAL)</label><textarea id="nota" rows="2">' + esc(form.nota) + '</textarea></div>';
  h += '<button class="nuevo" type="button" data-a="guardarLista"' + (form.enviando ? ' disabled' : '') + '>' + (form.enviando ? 'Guardando…' : 'Guardar lista') + '</button>';
  return h;
}
function htmlListas(v){
  v = v || []; var c = (v[0] || []).map(function(x){ return String(x||'').trim().toUpperCase(); });
  var iF = c.indexOf('FECHA'), iC = c.indexOf('CAJERO');
  var filas = v.slice(1).filter(function(r){ return r.some(function(x){ return String(x||'').trim(); }); });
  filas.sort(function(a,b){ var x = String(a[iF]||''), y = String(b[iF]||''); return x < y ? 1 : x > y ? -1 : 0; });
  if (!filas.length) return '<div class="box sub">Todavía no hay listas.</div>';
  return filas.map(function(r){
    var t = String(r[iF]||''), d = /^\d{4}-\d{2}-\d{2}T/.test(t) ? new Date(t) : null;
    var f = d && !isNaN(d) ? new Intl.DateTimeFormat('es-CO', {timeZone:'America/Bogota', weekday:'long', day:'2-digit', month:'2-digit', year:'numeric', hour:'numeric', minute:'2-digit'}).format(d) : t;
    var h = '<div class="box"><div class="lbl">' + esc(f) + '</div>' + (iC >= 0 && r[iC] ? '<div class="sub">' + esc(r[iC]) + '</div>' : '');
    var algo = false;
    c.forEach(function(n, i){
      if (i === iF || i === iC || !n || /IMAGEN|FOTO/.test(n)) return;
      var val = String(r[i]||'').trim(); if (!val) return; algo = true;
      h += '<div style="color:var(--yel);font-weight:800;margin-top:10px">' + esc(n) + '</div><div>' + val.split(',').map(function(x){ return esc(x.trim()); }).join(' · ') + '</div>';
    });
    if (!algo) h += '<div class="sub">Lista vacía.</div>';
    return h + '</div>';
  }).join('');
}
function pintar(){

  if (!D) return;

  else if (tab === 'reportes') app(pantalla === 'rep' && REPORTES[repSel] ? pReporte() : pReportes());

function cargar(fresco){
  if (!SEDE || !CLAVE){ document.getElementById('app').innerHTML = '<div class="aviso">Link incompleto. Pide el link de tu sede.</div>'; return; }
  if (leyendo && !fresco) return; leyendo = true;
  var bR = document.getElementById('btnRef'), bR2 = document.getElementById('btnRef2'); if (fresco){ if (bR) bR.style.opacity = '.4'; if (bR2){ bR2.style.opacity = '.4'; bR2.lastChild.nodeValue = 'Cargando…'; } }
  fetch(API + '?api=sede&s=' + encodeURIComponent(SEDE) + '&k=' + encodeURIComponent(CLAVE) + (fresco ? '&fresco=1' : ''), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(r){ leyendo = false; if (bR) bR.style.opacity = ''; if (bR2){ bR2.style.opacity = ''; bR2.lastChild.nodeValue = 'Actualizar'; } if (r.error){ if (!D) document.getElementById('app').innerHTML = '<div class="aviso">' + esc(r.error) + '</div>'; return; } D = r; ls('pg_sede_datos', JSON.stringify(r)); pintar(); })
    .catch(function(){ leyendo = false; if (bR) bR.style.opacity = ''; if (bR2){ bR2.style.opacity = ''; bR2.lastChild.nodeValue = 'Actualizar'; } if (!D) document.getElementById('app').innerHTML = '<div class="aviso">No se pudo cargar. Revisa el internet y toca ⟳.</div>'; });
}
function quien(){ var o = document.getElementById('cajeroOtro'); return (form.cajero === '__otro' || (o && form.cajero && (D.personal||[]).indexOf(form.cajero) < 0)) ? (o ? o.value.trim() : '') : form.cajero; }
function guardarLista(){
  if (form.enviando) return;

      else form.msg = {k:'bad', t:'No se guardó: ' + ((r && r.error) || 'error')};

function guardar(){
  if (form.enviando) return;

document.addEventListener('click', function(ev){
