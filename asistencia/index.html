<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asistencia Pizza Gourmet</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/asistencia/manifest.json">
<link rel="icon" href="/asistencia/icono-192.png">
<link rel="apple-touch-icon" href="/asistencia/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Asistencia PG">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--am:#FFC400;--am2:#ffdb4d;--ne:#000;--gr:#1a1a1a;--tx:#fff;--mu:#bdbdbd;--ok:#27c26c;--bad:#ff5a4f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ne);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;display:flex;flex-direction:column;gap:16px}
.logo{display:block;margin:8px auto 0;width:200px;max-width:70%}
h1{font-size:22px;margin:4px 0 0;text-align:center}
.sub{color:var(--mu);text-align:center;margin:0;font-size:15px}
.card{background:var(--gr);border:1px solid #2c2c2c;border-radius:16px;padding:16px}
.big{width:100%;min-height:150px;border:0;border-radius:24px;background:var(--am);color:#000;font-size:30px;font-weight:800;cursor:pointer;box-shadow:0 8px 0 #b38900;transition:transform .08s}
.big:active{transform:translateY(5px);box-shadow:0 3px 0 #b38900}
.big:disabled{background:#3a3a3a;color:#888;box-shadow:none}
.btn2{width:100%;padding:14px;border-radius:14px;border:2px solid var(--am);background:transparent;color:var(--am);font-size:17px;font-weight:700}
.res{font-size:20px;font-weight:700;text-align:center;line-height:1.4}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.fila{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2a2a2a;font-size:16px}
.fila:last-child{border:0}
.chip{display:inline-block;background:#2a2a2a;border-radius:99px;padding:6px 12px;font-size:14px;margin:2px}
.pasos{font-size:15px;color:var(--mu);line-height:1.6}
.pasos b{color:var(--am)}
.bots{display:flex;flex-direction:column;gap:12px}
.bm{width:100%;min-height:64px;border:2px solid #3a3a3a;border-radius:18px;background:#1f1f1f;color:#fff;font-size:20px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px}
.bm small{font-size:14px;font-weight:600;color:var(--mu)}
.bm.toca{min-height:130px;background:var(--am);border-color:var(--am);color:#000;font-size:28px;font-weight:800;box-shadow:0 8px 0 #b38900}
.bm.toca small{color:#000;font-size:17px}
.bm.toca:active{transform:translateY(5px);box-shadow:0 3px 0 #b38900}
.bm.hecho{background:#141414;border-color:#222;color:#666;min-height:54px;font-size:17px}
.bm.hecho small{color:#5f5f5f}
.bm:disabled{cursor:default}
.hide{display:none!important}
.reloj{font-size:44px;font-weight:800;text-align:center;letter-spacing:1px;color:var(--am)}
.peq{font-size:13px;color:var(--mu);text-align:center}
.pasos .tit{font-weight:800;margin-bottom:8px;color:#fff;font-size:16px}.pasos ul,.pasos ol{margin:0;padding-left:22px}.pasos ul{list-style:none;padding-left:0}.pasos li{margin:6px 0;line-height:1.35}</style>
</head>
<body>
<main>
  <img class="logo" src="/asistencia/logo.png" alt="Pizza Gourmet">
  <h1 id="tit">Asistencia</h1>
  <p class="sub" id="sub">Cargando…</p>
  <div id="vista"></div>
</main>
<script>
const API = "https://pizzerito-equipo.soyanibaldiaz.workers.dev/asistencia/api/";
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
const b64 = { enc: buf => { const u = new Uint8Array(buf); let s = ""; for (const b of u) s += String.fromCharCode(b); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  dec: s => { s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "="; const b = atob(s); return Uint8Array.from(b, c => c.charCodeAt(0)); } };
const guarda = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k,v) => { try { localStorage.setItem(k,v); } catch {} } };
async function api(r, body) { const o = body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {}; const res = await fetch(API + r, o); return res.json(); }
function esIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function instalada() { return matchMedia("(display-mode: standalone)").matches || navigator.standalone; }
function ayudaInstalar() {
  if (instalada()) return "";
  return esIOS() ? '<div class="card pasos"><div class="tit">📲 Instala la app</div><ol><li>Toca <b>Compartir</b> (el cuadrito con flecha ⬆️).</li><li>Toca <b>Agregar a inicio</b>.</li><li>Ábrela desde el ícono de <b>Pizza Gourmet</b>.</li></ol></div>'
                 : '<div class="card pasos"><div class="tit">📲 Instala la app</div><ol><li>En Chrome toca los <b>3 puntos ⋮</b>.</li><li>Toca <b>Agregar a pantalla principal</b> (o <b>Instalar app</b>).</li><li>Ábrela desde el ícono de <b>Pizza Gourmet</b>.</li></ol></div>';
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/asistencia/sw.js").catch(() => {});

// ---------- REGISTRO ----------
async function registro(tok) {
  $("#tit").textContent = "Registro de tu huella";
  const info = await api("reg-info?r=" + encodeURIComponent(tok));
  if (!info.ok) { $("#sub").textContent = info.error; return; }
  $("#sub").innerHTML = "Hola <b>" + info.nombre + "</b> 👋";
  $("#vista").innerHTML = '<div class="card pasos">Vas a amarrar <b>este celular</b> a tu nombre. Para marcar vas a usar la <b>huella o Face ID</b> de tu teléfono. Solo funciona desde este celular.</div>' +
    '<button class="big" id="bReg">👆 Registrar mi huella</button><p class="res" id="msg"></p>';
  $("#bReg").onclick = async () => {
    $("#bReg").disabled = true; $("#msg").textContent = "";
    try {
      if (!window.PublicKeyCredential || !(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())) throw new Error("Tu celular no tiene huella/Face ID activado o el navegador no lo permite. Ábrelo en Chrome (Android) o Safari (iPhone) y activa el bloqueo con huella.");
      const cred = await navigator.credentials.create({ publicKey: {
        rp: { name: "Pizza Gourmet Asistencia", id: location.hostname },
        user: { id: new TextEncoder().encode(info.id), name: info.nombre, displayName: info.nombre },
        challenge: b64.dec(info.ch),
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "required", requireResidentKey: true },
        attestation: "none", timeout: 90000 } });
      const r = await api("registrar", { r: tok, id: b64.enc(cred.rawId), clientDataJSON: b64.enc(cred.response.clientDataJSON), attestationObject: b64.enc(cred.response.attestationObject) });
      if (!r.ok) throw new Error(r.error);
      guarda.set("asis_c", r.id); guarda.set("asis_cred", r.cred); guarda.set("asis_nom", r.nombre);
      history.replaceState(null, "", "/asistencia/");
      $("#vista").innerHTML = '<p class="res ok">✅ ¡Listo, ' + r.nombre.split(" ")[0] + '! Tu huella quedó registrada.</p>' + ayudaInstalar() +
        '<div class="card pasos">Cada día: conéctate al <b>Wi-Fi de la sede</b>, abre la app y toca el botón que toca (el amarillo): <b>Entrada</b>, tu <b>break/almuerzo</b> y la <b>Salida</b>. 🔥 ¡Suma puntos llegando temprano!</div><button class="btn2" onclick="location.href=\'/asistencia/\'">Ir a marcar</button>';
    } catch (e) { $("#msg").innerHTML = '<span class="bad">' + (e.name === "NotAllowedError" ? "Se canceló o no se reconoció la huella. Intenta otra vez." : e.name === "InvalidStateError" ? "Este celular ya tiene un registro tuyo. Abre /asistencia y marca." : e.message) + "</span>"; $("#bReg").disabled = false; }
  };
}

// ---------- LINK DE SEDE: cada quien escoge su nombre (26 nov 2026) ----------
async function sedeLink(s) {
  $("#tit").textContent = "Registro de asistencia";
  if (guarda.get("asis_c") && guarda.get("asis_cred")) { $("#sub").innerHTML = "Este celular ya está registrado a nombre de <b>" + (guarda.get("asis_nom") || "") + "</b>"; $("#vista").innerHTML = '<button class="btn2" onclick="location.href=\'/asistencia/\'">Ir a marcar</button>'; return; }
  let r; try { r = await api("sede-info?s=" + encodeURIComponent(s)); } catch { $("#sub").textContent = "Sin internet. Revisa el Wi-Fi."; return; }
  if (!r.ok) { $("#sub").textContent = r.error; return; }
  $("#sub").innerHTML = "Sede <b>" + r.sede + "</b>";
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  $("#vista").innerHTML = (r.wifi ? "" : '<p class="res bad">📶 Conéctate al Wi-Fi de ' + esc(r.sede) + ' para registrarte.</p>') +
    '<div class="card pasos"><div class="tit">👇 Toca TU nombre</div>Solo el tuyo: la huella queda amarrada a este celular y a ese nombre.</div>' +
    '<div class="bots">' + r.lista.map(x => '<button class="bm" data-id="' + esc(x.id) + '">' + esc(x.nombre) + "</button>").join("") + "</div>" +
    '<div class="card pasos"><div class="tit">¿No apareces?</div>Escribe tu nombre y apellido:<br><input id="nNom" autocomplete="name" style="width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid #444;background:#111;color:#fff;font-size:17px"><button class="btn2" id="bNuevo" style="margin-top:10px">Registrarme</button></div><p class="res" id="msg"></p>';
  const tomar = async (body, txt) => {
    if (!confirm("¿Eres " + txt + "?")) return;
    document.querySelectorAll("button").forEach(b => b.disabled = true); $("#msg").textContent = "";
    const x = await api("sede-tomar", Object.assign({ s }, body)).catch(() => ({ ok: false, error: "Sin internet. Revisa el Wi-Fi." }));
    if (!x.ok) { $("#msg").innerHTML = '<span class="bad">' + esc(x.error) + "</span>"; document.querySelectorAll("button").forEach(b => b.disabled = false); return; }
    history.replaceState(null, "", "/asistencia/?r=" + encodeURIComponent(x.r)); registro(x.r);
  };
  document.querySelectorAll(".bm").forEach(b => b.onclick = () => tomar({ id: b.dataset.id }, b.textContent));
  $("#bNuevo").onclick = () => { const n = $("#nNom").value.trim(); if (n.split(/\s+/).length < 2) { $("#msg").innerHTML = '<span class="bad">Escribe tu nombre y apellido.</span>'; return; } tomar({ nuevo: n }, n); };
}

// ---------- WI-FI (cajera) ----------
async function wifi(t) {
  $("#tit").textContent = "Wi-Fi de la sede";
  const r = await api("wifi?t=" + encodeURIComponent(t));
  if (!r.ok) { $("#sub").textContent = r.error; return; }
  $("#sub").innerHTML = "Sede <b>" + r.sede + "</b>";
  $("#vista").innerHTML = '<div class="card pasos">' + (r.registrada ? "✅ Esta red <b>ya está registrada</b>." : "Esta red <b>todavía no</b> está registrada.") +
    '<br>Antes de tocar el botón, revisa que este celular esté <b>conectado al Wi-Fi de ' + r.sede + '</b> (no a datos móviles).</div>' +
    '<button class="big" id="bW">📶 Registrar este Wi-Fi</button><p class="res" id="msg"></p><p class="peq">Red: ' + r.red + ' · redes guardadas: ' + r.redes + '</p>';
  $("#bW").onclick = async () => { $("#bW").disabled = true; const x = await api("wifi", { t }); $("#msg").innerHTML = x.ok ? '<span class="ok">✅ Wi-Fi de ' + x.sede + ' registrado. Ya pueden marcar.</span>' : '<span class="bad">' + x.error + "</span>"; };
}

// ---------- MARCAR (v2: botones separados Entrada / Break o Almuerzo / Salida) ----------
let est = null, crono = null;
function hora12(hm) { if (!hm) return ""; let [h, m] = hm.split(":").map(Number); const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return h + ":" + String(m).padStart(2, "0") + " " + ap; }
function tic() { const el = $("#reloj"); if (el) el.textContent = new Date().toLocaleTimeString("es-CO", { timeZone: "America/Bogota", hour: "numeric", minute: "2-digit" }); }
setInterval(tic, 15000);
const mmss = s => { s = Math.abs(Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function botones(v) {
  const h = v.hoy || {}, brk = v.pausa === "break", P = brk ? "break" : "almuerzo", ic = brk ? "☕" : "🍽️";
  const bt = (k, txt, hecho, sub) => {
    const cls = hecho ? "bm hecho" : (v.sig === k ? "bm toca" : "bm");
    return '<button class="' + cls + '" data-k="' + k + '"' + (hecho ? " disabled" : "") + '>' + txt + (sub ? '<small>' + sub + "</small>" : "") + "</button>";
  };
  let pTxt = ic + " " + (brk ? "Break" : "Almuerzo"), pSub = brk ? "15 minutos" : "", pHecho = false;
  if (v.enPausa) { pTxt = "🔙 Volví del " + P; pSub = '<span id="crono"></span>'; }
  else if (h.pr) { pHecho = true; pSub = "✓ " + hora12(h.ps) + " – " + hora12(h.pr) + (h.dur != null ? " (" + h.dur + " min)" : ""); }
  if (!brk && v.almMin && !v.enPausa && !pHecho) pSub = "1 h 30 min";
  return bt("e", "🟢 Entrada", !!h.e, h.e ? "✓ " + hora12(h.e) : "") + (v.pausa ? bt("p", pTxt, pHecho, pSub) : "") + bt("s", "🏠 Salida", !!h.s, h.s ? "✓ " + hora12(h.s) : "");
}
function arrancarCrono(v) {
  if (crono) clearInterval(crono); crono = null;
  if (!v.enPausa || v.pausaSeg == null) return;
  const t0 = Date.now() - v.pausaSeg * 1000, lim = (v.pausa === "break" ? (v.breakMin || 15) : (v.almMin || 0)) * 60;
  const pinta = () => { const el = $("#crono"); if (!el) return; const seg = (Date.now() - t0) / 1000;
    if (!lim) { el.textContent = "Llevas " + Math.floor(seg / 60) + " min"; return; }
    const r = lim - seg; el.innerHTML = r >= 0 ? "⏱️ Te quedan <b>" + mmss(r) + "</b>" : '<span class="bad">⏰ Vas ' + mmss(r) + " tarde</span>"; };
  pinta(); crono = setInterval(pinta, 1000);
}
function pintar(v, msg) {
  $("#vista").innerHTML = '<div class="reloj" id="reloj"></div><div class="bots">' + botones(v) + '</div><p class="res" id="msg">' + (msg || "") + "</p>" +
    '<div style="text-align:center"><span class="chip">🔥 Racha ' + (v.racha || 0) + ' días</span>' + (v.puesto ? '<span class="chip">🏆 Vas ' + v.puesto + '.º</span>' : "") + "</div>" +
    '<div class="card pasos"><div class="tit">🏆 Reto Puntualidad</div><ul><li>⭐ Llegas <b>5 min antes</b>: <b>2 pts</b></li><li>✅ Llegas a la hora: <b>1 pt</b></li><li>⏰ Llegas tarde: <b>0 pts</b> y se corta la racha</li>' + (v.pausa === "break" ? "<li>☕ Vuelves tarde del break (más de 15 min): ese día <b>no suma</b></li>" : "") + "<li>🍕 Premio: <b>pizza mediana</b> al más puntual del mes</li></ul></div>" + ayudaInstalar();
  document.querySelectorAll(".bm").forEach(b => b.onclick = () => marcar(b.dataset.k));
  tic(); arrancarCrono(v);
}
async function cargar(msg) {
  $("#tit").textContent = guarda.get("asis_nom") ? "Hola, " + guarda.get("asis_nom").split(" ")[0] : "Asistencia";
  const c = guarda.get("asis_c") || "";
  try { est = await api("estado?c=" + encodeURIComponent(c)); } catch { $("#sub").textContent = "Sin internet. Revisa el Wi-Fi."; return; }
  if (!est.conocido) { $("#sub").textContent = "Este celular todavía no está registrado"; $("#vista").innerHTML = '<div class="card pasos">Abre primero el <b>link de registro de tu sede</b> (te lo manda la cajera o Aníbal) para amarrar tu huella a este celular.</div>' + ayudaInstalar(); return; }
  $("#tit").textContent = "Hola, " + est.nombre.split(" ")[0];
  $("#sub").innerHTML = (est.wifi ? "📍 " + est.sede : '<span class="bad">📶 No estás en el Wi-Fi de la sede</span>') + (est.turno ? " · Entrada " + hora12(est.turno) : "");
  pintar(est, msg);
}
function avisoLocal(v, k) {
  const h = v.hoy || {}, P = v.pausa === "break" ? "break" : "almuerzo";
  if (k === "e" && h.e) return "Ya marcaste tu entrada hoy a las " + hora12(h.e) + ".";
  if (k !== "e" && !h.e) return k === "s" ? "Primero marca tu 🟢 Entrada. No puedo marcar la salida sin entrada." : "Primero marca tu 🟢 Entrada; después sí tu " + P + ".";
  if (h.s) return "✅ Ya marcaste tu salida hoy (" + hora12(h.s) + "). ¡Hasta mañana!";
  if (k === "s" && v.enPausa) return "Estás en tu " + P + ": primero toca «🔙 Volví del " + P + "» y después marcas la salida.";
  return null;
}
async function marcar(k) {
  const av = est && avisoLocal(est, k); if (av) { $("#msg").innerHTML = '<span class="bad">' + av + "</span>"; return; }
  document.querySelectorAll(".bm").forEach(b => b.disabled = true); $("#msg").textContent = "👆 Pon tu huella…";
  try {
    if (!est || !est.ch) est = Object.assign(est || {}, await api("estado?c=" + encodeURIComponent(guarda.get("asis_c") || "")));
    const opt = { challenge: b64.dec(est.ch), rpId: location.hostname, userVerification: "required", timeout: 60000 };
    const cr = guarda.get("asis_cred"); if (cr) opt.allowCredentials = [{ type: "public-key", id: b64.dec(cr) }];
    const a = await navigator.credentials.get({ publicKey: opt });
    const body = { pedido: k, id: b64.enc(a.rawId), clientDataJSON: b64.enc(a.response.clientDataJSON), authenticatorData: b64.enc(a.response.authenticatorData), signature: b64.enc(a.response.signature) };
    if (window.__prueba) Object.assign(body, window.__prueba);
    const r = await api("marcar", body);
    est.ch = null;
    if (!r.ok) { const m = '<span class="bad">' + r.error + "</span>"; if (r.hoy) { est = Object.assign(est, r); pintar(est, m); } else { $("#msg").innerHTML = m; document.querySelectorAll(".bm:not(.hecho)").forEach(b => b.disabled = false); } return; }
    guarda.set("asis_c", r.id); guarda.set("asis_cred", body.id); guarda.set("asis_nom", r.nombre);
    est = Object.assign(est, r); pintar(est, '<span class="' + (r.msg.startsWith("⏰") ? "bad" : "ok") + '">' + r.msg + "</span>");
    if (navigator.vibrate) navigator.vibrate(120);
  } catch (e) { $("#msg").innerHTML = '<span class="bad">' + (e.name === "NotAllowedError" ? "No se reconoció la huella o se canceló. Intenta otra vez." : (e.message || e)) + "</span>"; if (est) est.ch = null; document.querySelectorAll(".bm:not(.hecho)").forEach(b => b.disabled = false); }
}

if (qs.get("r")) registro(qs.get("r"));
else if (qs.get("sede")) sedeLink(qs.get("sede"));
else if (qs.get("wifi")) wifi(qs.get("wifi"));
else cargar();
</script>
</body>
</html>
