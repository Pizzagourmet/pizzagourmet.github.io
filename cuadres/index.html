<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cuadres">
<link rel="icon" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<title>Cuadres Pizza Gourmet</title>
<style>
/* Layout: app de una columna como la de Glide — encabezado fijo, contenido, barra de navegación abajo (Hoy, 4 sedes, Global). Look oscuro y amarillo, a propósito en un solo tema. */
:root{
  --bg:#000000; --bar:#000000; --card:#161616; --card2:#0f0f0f; --line:#262626; --edge:#2e2e2e;
  --txt:#f5f5f5; --mut:#9b9b9b; --yel:#f0b90b; --yel-soft:#1d1a0d; --yel-bar:#ffd84d;
  --grn:#1fe01f; --grn-track:#16240f; --yel-track:#2a2510; --red:#ff6b6b;
  --ok:#2ecc71; --ok-bg:#0f2417; --warn:#f5c542; --warn-bg:#2a2410; --bad:#ff5252; --bad-bg:#1a1a1a; --off:#8a8a8a; --off-bg:#222;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:var(--f-ui);font-size:16px;-webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);border-bottom:1px solid var(--line);display:grid;grid-template-columns:40px 1fr 40px;align-items:center;min-height:58px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
header h1{margin:0;text-align:center;font-size:18px;font-weight:600;letter-spacing:.3px;text-wrap:balance;line-height:0}
header h1:not(:has(img)){line-height:1.2}
header .logo{height:46px;width:auto;max-width:100%;display:inline-block}
.marca{display:flex;justify-content:center;padding-block:4px 2px}
.marca img{height:38px;width:auto}
.icon-btn{background:none;border:0;color:var(--yel);font-size:22px;width:40px;height:40px;cursor:pointer;border-radius:10px}
main{max-width:720px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.mes{display:flex;align-items:center;justify-content:space-between}
.mes span{font-size:15px;letter-spacing:.8px;color:var(--mut)}
.mes button{background:var(--card);border:0;color:var(--yel);width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer}
.mes button:disabled{opacity:.3;cursor:default}
.eyebrow{font-size:20px;letter-spacing:.4px}
.stats-btn{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--yel-soft);border:0;border-radius:12px;padding:13px;color:var(--yel);font-size:14px;font-weight:600;letter-spacing:.5px;cursor:pointer;width:100%}
.pill{background:var(--yel);color:#111;border-radius:12px;text-align:center;font-size:26px;font-weight:700;padding:9px;font-variant-numeric:tabular-nums;display:block;width:100%;border:0;cursor:pointer}
.pill.fija{cursor:default}
.compara{display:flex;flex-wrap:wrap;gap:8px}
.cmp{font-size:14px;border-radius:999px;padding:6px 12px;background:var(--card);color:var(--mut);font-variant-numeric:tabular-nums}
.cmp b{font-weight:700;color:var(--txt)}
.cmp .up{color:var(--ok)} .cmp .down{color:var(--bad)}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);font-size:17px}
.row:last-child{border-bottom:0}
.row .k{color:var(--mut);letter-spacing:.3px;min-width:0}
.row .v{font-weight:500;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .t{display:flex;justify-content:space-between;gap:12px;font-size:17px;font-weight:600;margin-bottom:8px}
.bar .t span:last-child{color:var(--mut);font-weight:400;font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:6px;background:var(--grn-track);overflow:hidden}
.track .fill{height:100%;border-radius:6px;background:var(--grn)}
.track.y{background:var(--yel-track)} .track.y .fill{background:var(--yel-bar)}
.pres{background:var(--card2);border:1px solid var(--edge);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pres .cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--mut);font-size:14px;letter-spacing:.4px}
.pres .cab b{color:var(--txt);font-size:20px;font-variant-numeric:tabular-nums}
.track2{position:relative;height:14px;border-radius:8px;background:var(--grn-track);overflow:hidden}
.track2 .pos{position:absolute;inset:0 auto 0 0;background:var(--yel-bar);border-radius:8px}
.track2 .act{position:absolute;inset:0 auto 0 0;background:var(--grn);border-radius:8px}
.ley{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ley div{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mut)}
.ley b{color:var(--txt);font-size:18px;font-variant-numeric:tabular-nums}
.ley em{font-style:normal;color:var(--txt);font-size:14px;font-variant-numeric:tabular-nums}
.ley .lab{display:flex;align-items:center;gap:6px}
.dot{flex:none;display:inline-block;width:9px;height:9px;border-radius:50%}
.dot.g{background:var(--grn)} .dot.y{background:var(--yel-bar)}
.pres .meta{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0 0}
.meta{background:var(--card2);border:1px solid var(--edge);border-radius:14px;padding:14px;line-height:1.45;font-size:15px}
.meta .big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.meta .ok{color:var(--ok)} .meta .bad{color:var(--bad)}
h2{font-size:30px;font-weight:700;margin:14px 0 0}
.chart{background:var(--card2);border:1px solid var(--edge);border-radius:14px;padding:12px 10px 6px}
.chart .cab{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut);padding-inline:4px;margin-bottom:4px}
.chart svg{display:block;width:100%;height:auto}
.chart .b{fill:var(--yel)} .chart .b.max{fill:var(--yel-bar)} .chart .b.vacio{fill:#262626}
.chart .avg{stroke:var(--mut);stroke-dasharray:4 4;stroke-width:1}
.chart .lbl{fill:var(--mut);font-size:10px;font-family:var(--f-ui)}
.chart .vmax{fill:var(--txt);font-size:10px;font-weight:700;font-family:var(--f-ui)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dia{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:var(--yel);font-size:13px;font-weight:600;text-transform:uppercase;padding-top:6px}
.dia span:last-child{color:var(--txt);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cq{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.cq .f{color:var(--yel);font-size:13px;font-weight:600;text-transform:uppercase;line-height:1.3}
.cq .m{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.cq .td{font-size:13px;color:var(--txt);background:var(--yel-soft);border-radius:8px;padding:5px 8px;font-variant-numeric:tabular-nums}
.cq .td b{color:var(--yel)}
.rank{display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank.r2{flex-direction:column;align-items:stretch;gap:8px;padding-block:14px}
.rank.r2 .top{display:flex;align-items:center;gap:12px}
.rank.r2 .det{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.rank.r2 .det b{color:var(--txt);font-weight:600}
.rank .pos{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--card);color:var(--mut)}
.rank .pos.p1{background:var(--yel);color:#111}
.rank .nm{flex:1;min-width:0;font-size:17px;text-transform:uppercase}
.rank .nm small{display:block;color:var(--mut);font-size:13px}
.rank .vv{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cq .c{color:var(--mut);font-size:15px;text-transform:uppercase;overflow-wrap:anywhere}
.cq.nuevo{border-color:var(--yel)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{color:var(--ok);background:var(--ok-bg)} .chip.warn{color:var(--warn);background:var(--warn-bg)} .chip.bad{color:var(--bad);background:var(--bad-bg)} .chip.off{color:var(--off);background:var(--off-bg)}
.box{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:16px;min-width:0}
.box .lbl{color:var(--yel);font-size:14px;font-weight:600;text-transform:uppercase}
.box .sub{color:var(--mut);font-size:15px;margin-top:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi .lbl{color:var(--mut);font-weight:500}
.kpi .val{font-size:23px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.alerta{border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.4}
.alerta.bad{background:var(--card);color:var(--txt);border:1px solid var(--bad)} .alerta.warn{background:var(--warn-bg);color:#f3e2a6} .alerta.ok{background:var(--ok-bg);color:#c9f2d8}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{color:var(--yel);font-weight:500;font-size:15px;text-align:right;padding:6px 0 6px 8px}
td{padding:8px 0 8px 8px;font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left;color:var(--yel);font-weight:500;padding-left:0}
td.mal{color:var(--red)} td.med{color:var(--warn)}
.tres{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.tres .lbl{color:var(--yel);font-size:15px}
.tres .val{font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.g{display:flex;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);font-weight:600}
.g span:first-child{min-width:0;overflow-wrap:anywhere}
.g span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.g.cab{color:var(--mut);font-weight:500;font-size:13px;text-transform:uppercase}
.nota{background:var(--yel-soft);border-radius:12px;padding:12px;color:#e8d9a0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.vacio{color:var(--mut);text-align:center;padding-block:24px}
.sec{font-size:24px;font-weight:700;margin:6px 0 0}
.total{display:flex;gap:16px;align-items:center}
.total .ic{flex:none;width:76px;height:76px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden}
.total .lbl{color:var(--yel);font-size:14px;font-weight:600}
.total .val{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.total .sub{color:var(--mut);font-size:15px}
.hoy-sub{color:var(--mut);font-size:15px;text-align:center}
.sedeHoy{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%}
.sedeHoy .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sedeHoy .n{font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.sedeHoy .m{font-size:20px;font-weight:700;color:var(--yel);font-variant-numeric:tabular-nums;white-space:nowrap}
.sedeHoy .linea{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mut);font-size:14px;flex-wrap:wrap}
.sedeHoy.falta{border-color:var(--warn)}
/* Tarjetas de sede en HOY: nombre, tipo, estado, venta, órdenes y última orden */
.hx-sede{position:relative;display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:linear-gradient(180deg,#141414,#0c0c0c);border:1px solid #2c2c2c;border-radius:18px;padding:14px 40px 12px 16px;cursor:pointer;color:inherit}
.hx-sede.falta{border-color:#8a6d12}
.hx-nom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-right:-26px}
.hx-nom h3{margin:0;letter-spacing:.3px;text-transform:uppercase;display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;line-height:1.15;min-width:0}
.hx-nom h3 svg{flex:none;width:20px;height:20px;color:var(--yel-bar)}
.hx-tipo{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
.hx-tipo svg{flex:none;width:14px;height:14px}
.hx-est{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.hx-est.ok{color:#5ee08a;border:1px solid #1f6b35;background:#0d1f12}
.hx-est.ok::before{content:"✓";display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#22c55e;color:#06200f;font-size:10px;font-weight:900}
.hx-est.abierta{color:var(--yel-bar);border:1px solid #8a6d12;background:#1a1606}
.hx-est.abierta::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--yel-bar)}
.hx-est.falta{color:#ffb4a8;border:1px solid #8a2a2a;background:#230d0d}
.hx-est.falta::before{content:"!";display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--bad);color:#2a0000;font-size:10px;font-weight:900}
.hx-monto{color:var(--yel-bar);font-size:26px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.15}
.hx-monto.raya{width:24px;height:4px;border-radius:2px;background:var(--yel-bar);margin-block:12px 10px}
.hx-pie{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #2c2c2c;padding-top:9px;margin-top:4px}
.hx-pie > div{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;color:var(--mut);line-height:1.2}
.hx-pie > div + div{border-left:1px solid #2c2c2c;padding-left:12px}
.hx-pie svg{flex:none;width:22px;height:22px;color:#cfcfcf}
.hx-pie b{display:block;white-space:nowrap;color:var(--txt);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.hx-pie em{font-style:normal;color:#cfcfcf}
.hx-chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#9b9b9b}
.aviso{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:16px;line-height:1.45;color:var(--txt)}
.aviso b{color:var(--yel)}
.aviso button{margin-top:12px;background:var(--yel);border:0;color:#111;font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer}
#btnRef{visibility:hidden;pointer-events:none}
.act{color:var(--mut);font-size:13px;text-align:center;line-height:1.5}
.btn-act{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--yel);color:#111;border:0;border-radius:12px;padding:11px;font-size:20px;font-weight:800;cursor:pointer;margin-top:6px}
.btn-act:active{filter:brightness(.92)}
.btn-act .ic{font-size:22px;line-height:1;display:inline-block}
.btn-act.girando .ic{animation:g 1s linear infinite}
.btn-act:disabled{opacity:.75;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:#1f6b35;color:#fff;font-weight:700;font-size:15px;border-radius:999px;padding:10px 18px;box-shadow:0 6px 20px #0008;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.mal{background:#8a2a2a}
.cargando{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mut);padding-block:30vh}
.spin{width:18px;height:18px;border:2px solid #444;border-top-color:var(--yel);border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bar);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
nav button{background:none;border:0;color:#8a8a8a;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;cursor:pointer;flex:1;min-width:0;padding:4px 0;border-radius:10px}
nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--yel)}
.inc-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--yel-soft);border:1px solid #3a3210;border-radius:12px;padding:11px;color:var(--yel);font-size:15px;font-weight:700;letter-spacing:.5px;cursor:pointer}
.nivel{display:flex;flex-direction:column;gap:4px}
.nivel .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.nivel .sub{color:var(--mut);font-size:14px;line-height:1.4}
.niveles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.niveles div{background:var(--card2);border:1px solid var(--edge);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.niveles div b{display:block;color:var(--txt);font-size:14px;margin-top:2px}
.niveles div.on{border-color:var(--yel);background:var(--yel-soft)} .niveles div.on b{color:var(--yel)}
.per{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.per:last-child{border-bottom:0}
.per .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.per .n small{display:block;color:var(--mut);font-weight:400;font-size:12px;margin-top:2px}
.per .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.per .v b{display:block;font-size:16px}
.per .v small{color:var(--mut);font-size:12px}
.botones3{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.botones3 button{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:12px 6px;color:var(--txt);font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.botones3 button span{font-size:22px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:11px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .n{min-width:0;overflow-wrap:anywhere;font-size:15px}
.item .v{white-space:nowrap;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.item .v small{font-weight:600;font-size:12px;margin-left:6px}
.sube{color:var(--ok)} .baja{color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{background:var(--card2);border:1px solid var(--edge);border-radius:999px;padding:4px 10px;font-size:13px}
.hist{width:100%;border-collapse:collapse;font-size:13px}
.hist th,.hist td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.hist th:first-child,.hist td:first-child{text-align:left}
.reglas{color:var(--mut);font-size:14px;line-height:1.55}
.reglas b{color:var(--txt)}

/* HOY compacto: todo cabe en una pantalla de celular */

/* ---------- cálculos ---------- */
function esMesActual(){ return periodo.anio === ahora.a && periodo.mes === ahora.m; }
function diasDelMes(a, m){ return new Date(a || periodo.anio, m || periodo.mes, 0).getDate(); }
function diasCerrados(){ return esMesActual() ? Math.max(ahora.d - 1, 1) : diasDelMes(); }
function prefijo(a, m){ return a + '-' + (m<10?'0':'') + m; }
function delMes(s){ var pre = prefijo(periodo.anio, periodo.mes); return s.todos.filter(function(c){ return c.fecha.slice(0,7) === pre; }); }
function ventaEntre(s, desde, hasta){ return s.todos.reduce(function(a,c){ return c.fecha >= desde && c.fecha <= hasta ? a + c.total : a; }, 0); }

  delMes(s).forEach(function(c){ r.venta+=c.total; r.ordenes+=c.ordenes; r.dom+=c.dom; r.efectivo+=c.efectivo; r.transf+=c.transf; r.nequi+=c.nequi; r.wompi+=c.wompi; r.gastos+=c.gastos; r.propinas+=c.propinas; });

}
// Día de cierres que se está mirando: antes del mediodía, los de anoche
function diaOperativo(){

function comparaciones(s){

  // Últimos 7 días contra los 7 anteriores

  var dia = Math.min(+fin.slice(8,10), diasDelMes(pa, pm));

    actualizado = new Date(hora || Date.now()).toLocaleTimeString('es-CO',{hour:'numeric', minute:'2-digit', timeZone:'America/Bogota'});
    pintar();
  } catch (err) { aviso('Leí el libro, pero no pude entender su formato: ' + esc(err.message), 'Intentar de nuevo'); }
}
function leerUnaVez(fin){
  if (!CLAVE) { aviso('Link incompleto. Pide el link completo de Cuadres.'); if (fin) fin({message:'link incompleto'}); return; }
  if (leyendo) { if (fin) esperando = fin; return; } leyendo = true;
  if (!DATOS) document.getElementById('app').innerHTML = '<div class="cargando"><div class="spin"></div>Leyendo las hojas…</div>';
  fetch(API + '?api=1&k=' + encodeURIComponent(CLAVE), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(res){ leyendo = false; if (res && res.error) { if (!DATOS) aviso(esc(res.error), 'Intentar de nuevo'); avisar(fin, {message:res.error}); return; } try { localStorage.setItem('pg_c_datos', JSON.stringify({t: Date.now(), d: res})); } catch (e) {} cargandoRef = false; recibir(res); avisar(fin); })
    .catch(function(){ leyendo = false; if (!DATOS) aviso('No se pudo leer el libro de cuadres en este momento. Revisa tu conexión y toca Actualizar.', 'Actualizar'); avisar(fin, {message:'revisa la conexión'}); });
}
var esperando = null;
function avisar(fin, err){ var f = fin || esperando; esperando = null; if (f) f(err); }
function horaYa(){ return new Date().toLocaleTimeString('es-CO',{hour:'numeric', minute:'2-digit', timeZone:'America/Bogota'}); }
function toast(t, mal){
  var v = document.querySelector('.toast'); if (v) v.remove();
  var d = document.createElement('div'); d.className = 'toast' + (mal ? ' mal' : ''); d.setAttribute('role','status'); d.textContent = t;
  document.body.appendChild(d); setTimeout(function(){ d.remove(); }, mal ? 6000 : 2500);
}
function refrescarYa(){
  if (cargandoRef) return;
  revisarVersion();
  ahora = ahoraBogota(); cargandoRef = true; if (DATOS) pintar();
  leerUnaVez(function(err){ cargandoRef = false; if (DATOS) pintar(); toast(err ? 'No se pudo actualizar: ' + (err.message || 'revisa la conexión') : '✓ Actualizado ' + horaYa(), !!err); });
}
document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-a]'); if (!b) return;
  var a = b.getAttribute('data-a');
  if (a === 'tab'){ var t = b.getAttribute('data-t'); vista = {tab:t, pantalla:t==='global'?'global':t==='hoy'?'hoy':'sede', idx:null}; pintar(); window.scrollTo(0,0); }
  else if (a === 'irSede'){
    var id = b.getAttribute('data-t'), f = b.getAttribute('data-f'), s = DATOS.filter(function(x){ return x.id === id; })[0];
    var cs = s.todos.filter(function(c){ return c.fecha === f; });
    periodo = {anio:+f.slice(0,4), mes:+f.slice(5,7)};
    vista = cs.length === 1 ? {tab:id, pantalla:'detalle', idx:s.todos.indexOf(cs[0])} : {tab:id, pantalla:'sede', idx:null};
    pintar(); window.scrollTo(0,0);
  }
  else if (a === 'det'){ vista.pantalla = 'detalle'; vista.idx = +b.getAttribute('data-i'); pintar(); window.scrollTo(0,0); }
  else if (a === 'stats'){ vista.pantalla = 'stats'; pintar(); window.scrollTo(0,0); }
  else if (a === 'incentivos' || a === 'saldo' || a === 'lista' || a === 'cuentas'){ vista.pantalla = a; pintar(); window.scrollTo(0,0); }
  else if (a === 'global'){ vista.pantalla = 'global'; pintar(); window.scrollTo(0,0); }
  else if (a === 'volver'){ vista.pantalla = vista.tab === 'global' ? 'global' : 'sede'; vista.idx = null; pintar(); }
  else if (a === 'mes'){ var m = periodo.mes + (+b.getAttribute('data-d')), y = periodo.anio; if (m < 1){ m = 12; y--; } if (m > 12){ m = 1; y++; } periodo = {anio:y, mes:m}; if (vista.pantalla === 'detalle') vista.pantalla = 'sede'; pintar(); }
  else if (a === 'reintentar') leerUnaVez();
  else if (a === 'refrescar') refrescarYa();
});
document.getElementById('btnRef').addEventListener('click', refrescarYa);

nav();
// Muestra al instante lo último que se vio y luego trae lo nuevo
try { var guardado = JSON.parse(localStorage.getItem('pg_c_datos') || 'null'); if (guardado && guardado.d) recibir(guardado.d, guardado.t); } catch (e) {}
leerUnaVez();
setInterval(function(){ if (!document.hidden){ leerUnaVez(); revisarVersion(); } }, 60000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden){ leerUnaVez(); revisarVersion(); } });
})();
</script>
