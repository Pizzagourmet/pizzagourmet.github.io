<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test VAK · Pizza Gourmet</title><meta name="theme-color" content="#111111">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="icono-tests.png"><link rel="apple-touch-icon" href="icono-tests.png"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="comun.css">
</head><body><div class="wrap">
<header><img src="logo.png" alt="Pizza Gourmet"><div><h1>Test de Sistema de Lenguaje</h1><div class="sub">VAK · Visual, Auditivo o Kinestésico · Equipo Pizza Gourmet</div></div></header>
<div id="app"></div>
<p class="pie">Pizza Gourmet · tus respuestas son confidenciales y solo las ve la administración.</p>
</div>
<script src="datos.js"></script>
<script>
var K = 'pg_test_vak', E = leerLocal(K) || { paso: -1, r: [], datos: null };
var PARTES = { p: ['Parte 1 de 3 · Párrafos', 'Lee los tres párrafos y toca el que te resulte MÁS FÁCIL de leer. No te fijes en el significado.'], w: ['Parte 2 de 3 · Palabras', 'Toca la lista de palabras que te resulte MÁS FÁCIL de leer. Hazlo rápido.'], f: ['Parte 3 de 3 · Frases', 'Toca la frase que te resulte MÁS FÁCIL de leer.'] };
function salvar() { guardarLocal(K, E); }
function pintar() {
  var a = $('app');
  if (E.paso === -1) {
    a.innerHTML = '<div class="card"><h2>Antes de empezar</h2><ul class="intro"><li>Son <b>25 juegos</b> en 3 partes: párrafos, listas de palabras y frases cortas.</li><li>En cada juego toca la opción que te resulte <b>más fácil de leer</b>, sin fijarte en el significado.</li><li>No lo pienses mucho: tu primera respuesta suele ser la mejor.</li><li>Toma unos 5 minutos.</li></ul>' + formDatos((E.datos || {}).sede) + '<div class="fila"><button class="btn full" onclick="empezar()">Empezar</button></div></div>';
    if (E.datos) { $('nom').value = E.datos.nombre || ''; $('cargo').value = E.datos.cargo || ''; }
    return;
  }
  if (E.paso >= VAK.length) return final();
  var q = VAK[E.paso], P = PARTES[q[0]], r = E.r[E.paso];
  var h = '<div class="card"><div class="prog">' + P[0] + ' · juego ' + (E.paso + 1) + ' de ' + VAK.length + '</div><div class="barra"><i style="width:' + Math.round(E.paso / VAK.length * 100) + '%"></i></div><p class="ayuda">' + P[1] + '</p>';
  for (var i = 1; i <= 3; i++) {
    var L = 'ABC'[i - 1];
    h += '<button class="op' + (r === L ? ' sel' : '') + '" onclick="tocar(\'' + L + '\')"><span class="n">' + L + '</span><span' + (q[0] === 'p' ? '' : ' style="font-size:18px;font-weight:600"') + '>' + esc(q[i]) + '</span></button>';
  }
  h += '<div class="fila"><button class="btn sec" onclick="atras()">← Atrás</button>' + (r ? '<button class="btn" onclick="sig()">' + (E.paso === VAK.length - 1 ? 'Ver mi resultado' : 'Siguiente →') + '</button>' : '') + '</div></div>';
  a.innerHTML = h;
}
function empezar() {
  var n = $('nom').value.trim(), s = $('sede').value;
  if (n.length < 3) { aviso('Escribe tu nombre completo'); return; }
  if (!s) { aviso('Escoge tu sede'); return; }
  E.datos = { nombre: n, sede: s, cargo: $('cargo').value.trim() }; E.paso = 0; salvar(); pintar(); scrollTo(0, 0);
}
function aviso(t) { var d = document.createElement('div'); d.style.cssText = 'background:#fde8e8;color:#a3121e;padding:10px 12px;border-radius:12px;margin:8px 0;font-weight:600'; d.textContent = t; var c = document.querySelector('.card'); c.insertBefore(d, c.children[1]); setTimeout(function () { d.remove(); }, 3500); }
function tocar(L) { E.r[E.paso] = L; salvar(); setTimeout(sig, 180); pintar(); }
function sig() { if (!E.r[E.paso]) return; E.paso++; salvar(); pintar(); scrollTo(0, 0); }
function atras() { E.paso = E.paso > 0 ? E.paso - 1 : -1; salvar(); pintar(); scrollTo(0, 0); }
function calcular() {
  var c = { A: 0, V: 0, K: 0 };
  E.r.forEach(function (L, i) { var k = VAK_CLAVE[i]; if (L === k[0]) c.A++; else if (L === k[1]) c.V++; else if (L === k[2]) c.K++; });
  var p = { A: c.A * 4, V: c.V * 4, K: c.K * 4 };
  var orden = Object.keys(p).sort(function (x, y) { return p[y] - p[x]; });
  return { puntos: p, principal: orden[0], secundario: orden[1], terciario: orden[2], empate: p[orden[0]] === p[orden[1]] };
}
function final() {
  var R = calcular(), a = $('app');
  var h = '<div class="card"><h2>🎉 ¡Gracias, ' + esc(E.datos.nombre.split(' ')[0]) + '!</h2><p>Tu sistema principal es:</p><div style="font:800 30px \'Baloo 2\',sans-serif;color:' + VAK_EST[R.principal].c + '">' + VAK_EST[R.principal].n + '</div><p class="nota">Secundario: <b>' + VAK_EST[R.secundario].n + '</b> · Terciario: <b>' + VAK_EST[R.terciario].n + '</b>' + (R.empate ? ' (los dos primeros quedaron empatados)' : '') + '</p>';
  ['V', 'A', 'K'].forEach(function (L) { var p = R.puntos[L]; h += '<div class="res-est"><span>' + VAK_EST[L].n + '</span><span>' + p + ' / 100</span></div><div class="barra"><i style="width:' + p + '%;background:' + VAK_EST[L].c + '"></i></div>'; });
  h += '<p>' + esc(VAK_EST[R.principal].d) + '</p><p id="envio" class="nota">⏳ Guardando tu resultado…</p><div class="fila"><button class="btn sec" onclick="otra()">Hacer el test otra persona</button></div></div>';
  a.innerHTML = h;
  if (E.enviado) { $('envio').textContent = '✅ Tu resultado ya quedó guardado.'; return; }
  enviarTest('vak', E.datos, E.r, R, function (ok) {
    if (ok) { E.enviado = true; salvar(); $('envio').innerHTML = '✅ Tu resultado quedó guardado. Ya puedes cerrar esta página.'; }
    else $('envio').innerHTML = '❌ No se pudo guardar (revisa el internet). <button class="btn" onclick="final()">Intentar de nuevo</button>';
  });
}
function otra() { if (!confirm('¿Empezar el test para otra persona?')) return; E = { paso: -1, r: [], datos: null }; salvar(); pintar(); scrollTo(0, 0); }
pintar();
</script>
</body></html>
