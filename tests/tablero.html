<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablero de tests · Pizza Gourmet</title><meta name="theme-color" content="#111111"><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="icono-tests.png"><link rel="apple-touch-icon" href="icono-tests.png"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="comun.css">
<style>
.wrap{max-width:1200px}
.resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--black);color:#fff;border-radius:16px;padding:10px 12px;border-bottom:4px solid var(--brand)}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:#ddd}
.filtros{display:flex;gap:8px;flex-wrap:wrap}.filtros>*{flex:1;min-width:150px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;color:var(--mut);padding:8px 6px;border-bottom:2px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid #f3ecd6;vertical-align:top}
.est{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-weight:700;font-size:13px}
.mini{display:flex;gap:2px;height:8px;margin-top:5px;max-width:180px}.mini i{display:block;height:100%;border-radius:2px}
.x{border:0;background:none;color:#b9a77a;cursor:pointer;font-size:13px}
.cnt{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
@media(max-width:700px){.ocultar{display:none}}
details.guia{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:14px;box-shadow:0 2px 0 var(--line)}
details.guia summary{font:700 18px 'Baloo 2','Poppins',sans-serif;cursor:pointer}
details.guia h3{margin:14px 0 6px;font-size:16px}details.guia p,details.guia li{font-size:14.5px}
.estilo{border-left:6px solid;padding:6px 12px;margin:10px 0;background:#fffcf3;border-radius:0 12px 12px 0}
.estilo b{font-size:15px}.estilo ul{margin:4px 0 0;padding-left:18px}
tr.det td{background:#fffbea;font-size:14px}tr.persona{cursor:pointer}tr.persona:hover td{background:#fffdf5}
</style>
</head><body><div class="wrap">
<header><img src="logo.png" alt="Pizza Gourmet"><div><h1>Tablero de tests del equipo</h1><div class="sub">DISC (comportamiento) y VAK (sistema de lenguaje)</div></div></header>
<div id="app"><div class="card">Cargando…</div></div>
</div>
<script src="datos.js"></script>
<script>
var PIN = leerLocal('pg_tests_pin') || '', D = null, F = { sede: '', q: '', falta: '' };
try { if (!PIN) PIN = localStorage.getItem('pg_radar_pin') || ''; } catch (e) {}

var GUIA_DISC = {
  A: { f: 'Decide rápido, asume retos, va por resultados y no le teme a la presión.', m: 'Puede ser impaciente, mandón o brusco; le cuesta escuchar y delegar con calma.', l: 'Háblele directo y corto. Dele metas claras, autonomía y retos. Reconozca resultados. Ideal para: liderar turnos, resolver problemas, abrir sede.' },
  B: { f: 'Alegre, motivador, se le da la gente: clientes, ventas y ambiente del equipo.', m: 'Puede ser desordenado, olvidadizo o impuntual; habla más de lo que escucha.', l: 'Reconózcalo en público, déjelo participar y proponer. Ayúdele con listas y recordatorios. Ideal para: atención al cliente, caja, redes, eventos y cumpleaños.' },
  C: { f: 'Paciente, leal, constante; une al equipo y trabaja sin conflictos.', m: 'Le cuestan los cambios bruscos y la presión; evita decir que no o expresar lo que siente.', l: 'Explíquele los cambios con tiempo y con calma. Dele seguridad, rutinas claras y pregúntele su opinión en privado. Ideal para: cocina, producción, procesos repetitivos.' },
  D: { f: 'Ordenado, preciso, cuida la calidad, los detalles y las reglas.', m: 'Puede ser terco, muy crítico o lento por perfeccionista; prefiere trabajar solo.', l: 'Dele información exacta, procedimientos por escrito y tiempo para revisar. Corríjalo con datos, no con emociones. Ideal para: cuadres, inventarios, recetas, control de calidad.' }
};
function guiaHTML() {
  var h = '<details class="guia"><summary>📖 Cómo leer los resultados</summary>';
  h += '<h3>Test DISC · Estilo de Comportamiento</h3><p><b>Cómo se calcula:</b> son 26 preguntas con 4 opciones (A, B, C y D). La persona ordena las opciones de 4 (la que más la identifica) a 1 (la que menos). Se suman los puntos de cada letra: cada una puede sacar entre 26 y 104 puntos y entre las cuatro siempre suman 260.</p><p><b>Cómo se lee:</b> la letra con más puntos es su <b>estilo principal</b> (cómo actúa casi siempre, sobre todo bajo presión) y la segunda es su <b>estilo secundario</b> (lo que lo complementa). Si dos quedan muy parejos, la persona combina los dos estilos. Nadie es de un solo estilo: todos tenemos un poco de los cuatro.</p>';
  'ABCD'.split('').forEach(function (k) { var e = DISC_EST[k], g = GUIA_DISC[k]; h += '<div class="estilo" style="border-color:' + e.c + '"><b style="color:' + e.c + '">' + k + '. ' + e.n + ' (' + e.t + ')</b><ul><li><b>Fortalezas:</b> ' + g.f + '</li><li><b>A mejorar:</b> ' + g.m + '</li><li><b>Cómo liderarlo:</b> ' + g.l + '</li></ul></div>'; });
  h += '<h3>Test VAK · Sistema de Lenguaje</h3><p><b>Cómo se calcula:</b> son 25 juegos (5 de párrafos, 10 de listas de palabras y 10 de frases cortas). En cada uno la persona escoge lo que le resulta más fácil de leer, y cada opción corresponde a Visual, Auditivo o Kinestésico. Se cuentan las de cada sistema y se multiplican por 4, así el puntaje queda de 0 a 100 y entre los tres suman 100.</p><p><b>Cómo se lee:</b> el puntaje <b>más alto</b> es su sistema <b>primario</b>: el que usa la mayor parte del tiempo para entender y comunicarse, sobre todo cuando está resolviendo un problema o bajo tensión. El <b>segundo</b> es el <b>secundario</b>, que usa a menudo en las conversaciones del día. El <b>más bajo</b> es el <b>terciario</b>, el que menos usa y que muchas veces se queda en el subconsciente.</p>';
  ['V', 'A', 'K'].forEach(function (k) { var e = VAK_EST[k]; h += '<div class="estilo" style="border-color:' + e.c + '"><b style="color:' + e.c + '">' + e.n + '</b><p style="margin:4px 0 0">' + e.d + '</p></div>'; });
  h += '<p><b>Para qué le sirve al equipo:</b> si usted le habla a cada persona en su sistema, le entiende más rápido y se genera más confianza. Al visual dígale "mira", muéstrele fotos y videos; al auditivo dígale "escucha", explíquele hablando o con un audio; al kinestésico dígale "toma, hazlo conmigo" y déjelo practicar.</p>';
  h += '<h3>Cómo usar el tablero</h3><ul><li>Toque el nombre de una persona para ver la explicación completa de sus resultados.</li><li>Use los filtros para ver una sede o a quién le falta un test, y el botón <b>Descargar Excel</b> para guardarlo.</li><li>Si alguien hizo un test dos veces, se muestra el más reciente; con la ✕ puede borrar el que sobra.</li><li>Los resultados son una guía para conocer y liderar mejor al equipo, no para juzgar a nadie ni para decidir contrataciones por sí solos.</li></ul></details>';
  return h;
}
var ABIERTO = '';
function abrir(ev, tr) { if (ev.target.tagName === 'BUTTON') return; var k = tr.getAttribute('data-k'); ABIERTO = ABIERTO === k ? '' : k; pintar(); }
function detalle(p) {
  var h = '', d = p.disc && p.disc.resultado, v = p.vak && p.vak.resultado;
  if (d) { var e = DISC_EST[d.principal], g = GUIA_DISC[d.principal]; h += '<p><b>DISC:</b> su estilo principal es <b style="color:' + e.c + '">' + e.n + '</b> (' + d.puntos[d.principal] + ' puntos) y el secundario <b>' + DISC_EST[d.secundario].n + '</b> (' + d.puntos[d.secundario] + '). Puntos: Dominante ' + d.puntos.A + ' · Influyente ' + d.puntos.B + ' · Estable ' + d.puntos.C + ' · Minucioso ' + d.puntos.D + '.</p><ul><li><b>Fortalezas:</b> ' + g.f + '</li><li><b>A mejorar:</b> ' + g.m + '</li><li><b>Cómo liderarlo:</b> ' + g.l + '</li></ul>'; }
  if (v) { var e2 = VAK_EST[v.principal]; h += '<p><b>VAK:</b> primario <b style="color:' + e2.c + '">' + e2.n + '</b> (' + v.puntos[v.principal] + '/100), secundario ' + VAK_EST[v.secundario].n + ' (' + v.puntos[v.secundario] + '), terciario ' + VAK_EST[v.terciario].n + ' (' + v.puntos[v.terciario] + ').</p><p>' + e2.d + '</p>'; }
  return h || '<p class="nota">Todavía no ha hecho ningún test.</p>';
}
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
function cargar() {
  if (!PIN) return pedirPin('');
  fetch(API_TESTS + 'lista?pin=' + encodeURIComponent(PIN)).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) { PIN = ''; guardarLocal('pg_tests_pin', ''); return pedirPin(j.error || 'PIN incorrecto'); }
    guardarLocal('pg_tests_pin', PIN); D = j.tests; pintar();
  }).catch(function () { if (!D) $('app').innerHTML = '<div class="card">No se pudo cargar. Revisa el internet.</div>'; });
}
function pedirPin(msg) {
  $('app').innerHTML = '<div class="card" style="max-width:380px;margin:20px auto"><h2>Administración</h2><label>PIN</label><input id="pin" type="password" inputmode="numeric" onkeydown="if(event.key===\'Enter\')entrar()"><p style="color:#d6262b">' + esc(msg) + '</p><button class="btn full" onclick="entrar()">Entrar</button></div>';
}
function entrar() { PIN = $('pin').value.trim(); cargar(); }
function personas() {
  var P = {};
  D.forEach(function (t) {
    var k = norm(t.nombre) + '|' + norm(t.sede);
    var p = P[k] || (P[k] = { nombre: t.nombre, sede: t.sede, cargo: t.cargo, disc: null, vak: null, t: 0 });
    if (!p[t.test] || p[t.test].t < t.t) p[t.test] = t;   // se queda el más reciente
    if (t.cargo) p.cargo = t.cargo; p.t = Math.max(p.t, t.t);
  });
  return Object.keys(P).map(function (k) { return P[k]; }).sort(function (a, b) { return b.t - a.t; });
}
function pintar() {
  var L = personas().filter(function (p) {
    if (F.sede && p.sede !== F.sede) return false;
    if (F.q && norm(p.nombre).indexOf(norm(F.q)) < 0) return false;
    if (F.falta === 'disc' && p.disc) return false; if (F.falta === 'vak' && p.vak) return false;
    if (F.falta === 'ambos' && !(p.disc && p.vak)) return false;
    return true;
  });
  var nd = L.filter(function (p) { return p.disc; }).length, nv = L.filter(function (p) { return p.vak; }).length, nb = L.filter(function (p) { return p.disc && p.vak; }).length;
  var cD = { A: 0, B: 0, C: 0, D: 0 }, cV = { A: 0, V: 0, K: 0 };
  L.forEach(function (p) { if (p.disc) cD[p.disc.resultado.principal]++; if (p.vak) cV[p.vak.resultado.principal]++; });
  var h = '<div class="card"><div class="filtros"><select onchange="F.sede=this.value;pintar()"><option value="">Todas las sedes</option>' + SEDES_TEST.map(function (s) { return '<option' + (F.sede === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select>' +
    '<select onchange="F.falta=this.value;pintar()"><option value="">Todos</option><option value="ambos"' + (F.falta === 'ambos' ? ' selected' : '') + '>Hicieron los dos</option><option value="disc"' + (F.falta === 'disc' ? ' selected' : '') + '>Les falta el DISC</option><option value="vak"' + (F.falta === 'vak' ? ' selected' : '') + '>Les falta el VAK</option></select>' +
    '<input placeholder="Buscar por nombre" value="' + esc(F.q) + '" oninput="F.q=this.value;clearTimeout(window._t);window._t=setTimeout(pintar,250)"><button class="btn sec" onclick="exportar()">⬇️ Descargar Excel</button></div></div>';
  h += '<div class="kpis"><div class="kpi"><b>' + L.length + '</b><span>Personas</span></div><div class="kpi"><b>' + nd + '</b><span>Hicieron el DISC</span></div><div class="kpi"><b>' + nv + '</b><span>Hicieron el VAK</span></div><div class="kpi"><b>' + nb + '</b><span>Hicieron los dos</span></div></div>';
  h += guiaHTML();
  h += '<div class="resumen"><div class="card"><h2>Estilos DISC del equipo</h2>' + 'ABCD'.split('').map(function (k) { var n = cD[k], pc = nd ? Math.round(n / nd * 100) : 0; return '<div class="cnt"><span>' + DISC_EST[k].n + ' <span class="nota">(' + DISC_EST[k].t + ')</span></span><span>' + n + ' · ' + pc + '%</span></div><div class="barra"><i style="width:' + pc + '%;background:' + DISC_EST[k].c + '"></i></div>'; }).join('') + '</div>';
  h += '<div class="card"><h2>Sistemas VAK del equipo</h2>' + ['V', 'A', 'K'].map(function (k) { var n = cV[k], pc = nv ? Math.round(n / nv * 100) : 0; return '<div class="cnt"><span>' + VAK_EST[k].n + '</span><span>' + n + ' · ' + pc + '%</span></div><div class="barra"><i style="width:' + pc + '%;background:' + VAK_EST[k].c + '"></i></div>'; }).join('') + '<p class="nota">Tip: a los visuales enséñeles con fotos y videos; a los auditivos, explicándoles; a los kinestésicos, haciéndolo con ellos.</p></div></div>';
  h += '<div class="card"><h2>Resultados por persona</h2>' + (L.length ? '<table><tr><th>Nombre</th><th class="ocultar">Sede · cargo</th><th>DISC</th><th>VAK</th><th class="ocultar">Fecha</th></tr>' + L.map(fila).join('') + '</table>' : '<p class="nota">Todavía nadie ha hecho los tests' + (F.sede || F.q || F.falta ? ' con este filtro' : '') + '.</p>') + '</div>';
  h += '<p class="nota">Se actualiza solo cada minuto. Toca ✕ para borrar un test (por ejemplo, si alguien lo hizo dos veces o fue una prueba).</p>';
  var g = document.querySelector('details.guia'), abierta = g && g.open;
  $('app').innerHTML = h;
  if (abierta) document.querySelector('details.guia').open = true;
}
function fila(p) {
  var d = p.disc, v = p.vak, kk = norm(p.nombre) + '|' + norm(p.sede), h = '<tr class="persona" data-k="' + esc(kk) + '" onclick="abrir(event,this)"><td><b>' + esc(p.nombre) + '</b> <span class="nota">▾</span><div class="nota" style="display:none">' + esc(p.sede) + '</div></td><td class="ocultar">' + esc(p.sede) + (p.cargo ? '<br><span class="nota">' + esc(p.cargo) + '</span>' : '') + '</td>';
  if (d) { var r = d.resultado, t = r.puntos, s = t.A + t.B + t.C + t.D || 1; h += '<td><span class="est" style="background:' + DISC_EST[r.principal].c + '">' + DISC_EST[r.principal].n + '</span><div class="nota">2.º ' + DISC_EST[r.secundario].n + '</div><div class="mini">' + 'ABCD'.split('').map(function (k) { return '<i title="' + DISC_EST[k].n + ' ' + t[k] + '" style="width:' + (t[k] / s * 100) + '%;background:' + DISC_EST[k].c + '"></i>'; }).join('') + '</div><button class="x" onclick="borrar(' + d.id + ')">✕</button></td>'; }
  else h += '<td class="nota">— Falta</td>';
  if (v) { var r2 = v.resultado, q = r2.puntos; h += '<td><span class="est" style="background:' + VAK_EST[r2.principal].c + '">' + VAK_EST[r2.principal].n + '</span><div class="nota">V ' + q.V + ' · A ' + q.A + ' · K ' + q.K + '</div><div class="mini">' + ['V', 'A', 'K'].map(function (k) { return '<i style="width:' + q[k] + '%;background:' + VAK_EST[k].c + '"></i>'; }).join('') + '</div><button class="x" onclick="borrar(' + v.id + ')">✕</button></td>'; }
  else h += '<td class="nota">— Falta</td>';
  h += '<td class="ocultar nota">' + new Date(p.t).toLocaleDateString('es-CO', { timeZone: 'America/Bogota', day: '2-digit', month: 'short' }) + '</td></tr>';
  if (ABIERTO === kk) h += '<tr class="det"><td colspan="5">' + detalle(p) + '</td></tr>';
  return h;
}
function borrar(id) {
  if (!confirm('¿Borrar este test? No se puede deshacer.')) return;
  fetch(API_TESTS + 'borrar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pin: PIN, id: id }) }).then(function () { cargar(); });
}
function exportar() {
  var filas = [['Nombre', 'Sede', 'Cargo', 'DISC principal', 'DISC secundario', 'Dominante', 'Influyente', 'Estable', 'Minucioso', 'VAK principal', 'Visual', 'Auditivo', 'Kinestésico']];
  personas().forEach(function (p) {
    var d = p.disc && p.disc.resultado, v = p.vak && p.vak.resultado;
    filas.push([p.nombre, p.sede, p.cargo || '', d ? DISC_EST[d.principal].n : '', d ? DISC_EST[d.secundario].n : '', d ? d.puntos.A : '', d ? d.puntos.B : '', d ? d.puntos.C : '', d ? d.puntos.D : '', v ? VAK_EST[v.principal].n : '', v ? v.puntos.V : '', v ? v.puntos.A : '', v ? v.puntos.K : '']);
  });
  var csv = '﻿' + filas.map(function (f) { return f.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(';'); }).join('\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'tests-equipo-pizza-gourmet.csv'; a.click();
}
cargar();
setInterval(function () { if (PIN && document.visibilityState === 'visible' && !(document.activeElement && document.activeElement.tagName === 'INPUT')) cargar(); }, 60000);
</script>
</body></html>
