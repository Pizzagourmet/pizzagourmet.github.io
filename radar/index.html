<style>
:root{--bg:#fffaf0;--card:#fff;--ink:#141414;--mut:#6f6656;--line:#f1e4bd;--red:#d6262b;--redbg:#fde8e8;
--ok:#1f8a4c;--okbg:#e5f6ec;--warn:#a86400;--warnbg:#fff1d6;--blue:#1d5fbf;--bluebg:#e6efff;--brand:#ffc61a;--brand2:#f39200;--black:#111}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Poppins',-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 40px}
header{display:flex;align-items:center;gap:12px;margin:0 -14px 14px;padding:12px 16px 14px;background:var(--black);color:#fff;border-bottom:5px solid var(--brand);border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(0,0,0,.18)}

header h1{font:700 19px/1.15 'Baloo 2','Poppins',sans-serif;margin:0;color:#fff}header .sub{font-size:12px;color:var(--brand)}

.search{display:flex;gap:8px}
.search input{flex:1;font:600 20px 'Poppins',sans-serif;padding:12px 14px;border:2px solid var(--line);border-radius:14px;outline:none;background:#fff}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,198,26,.35)}
.res{margin-top:10px;border-radius:14px;padding:12px 14px;font-weight:600}
.res.ok{background:var(--okbg);color:var(--ok)}.res.no{background:var(--redbg);color:var(--red)}
.res small{display:block;font-weight:400;color:var(--ink);margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--black);color:#fff;border-radius:16px;padding:10px 12px;border-bottom:4px solid var(--brand)}

.chips{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px;padding-bottom:2px}

.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:1px}
.tag.N{background:#f3e8ff;color:#7a2fc2}.tag.B{background:#fff1b8;color:#6b4e00}.tag.W{background:#dcf7ec;color:#0b7a55}
.kpis.k3{grid-template-columns:repeat(3,1fr)}.kpis.k3 .kpi b{font-size:17px}
.row{cursor:pointer}.row.open{background:#fffbea}
.det{margin:-2px 0 6px;padding:10px 12px;background:#fffbea;border:1px solid var(--line);border-radius:12px;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}

.opc{display:block;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;cursor:pointer;color:inherit;text-decoration:none}

/* Último pago en el encabezado (18 nov 2026): titila 30 s cuando entra uno nuevo */

/* Cinta de últimos pagos en el encabezado (18 nov 2026): se mueve de derecha a izquierda */
.tick{flex:1 1 auto;min-width:120px;overflow:hidden;position:relative;height:34px;border-radius:999px;background:rgba(255,255,255,.06);

#salT{margin-left:2px}#salT.mal{color:#ff6b6b;font-weight:700}

.btn.cierre{background:#111;color:#ffc61a;white-space:nowrap;border:1px solid #ffc61a}header .btn.cierre{flex:0 0 auto;background:#ffc61a;color:#111}

.dem{display:inline-block;margin-left:8px;vertical-align:middle;font:600 11.5px/1 'Poppins',sans-serif;font-style:normal;padding:4px 8px;border-radius:999px;background:#000;border:1.5px solid #2fd196;color:#fff}

.sonido{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;border:0;border-radius:999px;padding:10px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer;background:#111;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.3)}

.auto{margin:8px 0;padding:10px 12px;border-radius:12px;background:#111;color:#fff;border:2px solid #ffc61a;font-size:13px}
.prueba{grid-column:1/-1;margin-top:4px;padding:8px 10px;background:#fff;border:1px dashed #c9b878;border-radius:10px;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;color:#333}
.nota{margin:0 0 8px;display:flex;gap:6px}.nota input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.bmini{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
#ayuda{position:fixed;inset:0;z-index:41;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}

body.grande .wrap{max-width:none}body.grande #app{zoom:1.3}
.registro{font-size:13px}.registro div{padding:5px 0;border-bottom:1px dashed #eee}
.sede .salud{margin-top:6px}

/* Vista ancha para el computador (17 nov 2026): una columna por medio de pago + alertas */
body.ancho .wrap{max-width:none;padding:0 16px 16px}
body.ancho header{margin:0 -16px 10px;padding:8px 18px 9px;border-radius:0}
body.ancho header .logo{height:40px}body.ancho header h1{font-size:18px}
body.ancho .anchoTop{grid-template-columns:1fr 340px;margin-bottom:10px}
body.ancho .anchoTop .card{margin:0;padding:8px 12px;display:flex;align-items:center;gap:12px}
body.ancho .anchoTop .card h2{margin:0;font-size:14px;white-space:nowrap}
body.ancho .anchoTop .search{flex:1}body.ancho .anchoTop .search input{font-size:16px;padding:8px 12px}
body.ancho .anchoTop #res{flex:none;max-width:45%}body.ancho .anchoTop .res{margin:0;padding:6px 10px;font-size:13px}

body.ancho .col .mid .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.ancho .leyenda{margin:6px 0 0;font-size:12px}

/* pantalla grande: 4 columnas lado a lado, cada una baja por su cuenta */
@media (min-width:1300px){body.ancho .col{max-height:calc(100vh - 150px)}}
/* computador pequeño o portátil: columnas de 2 en 2 */
@media (max-width:1299px){body.ancho .cols.c4,body.ancho .cols.c3{grid-template-columns:repeat(2,minmax(0,1fr))}body.ancho .col{max-height:calc(50vh - 80px)}body.ancho .anchoTop{grid-template-columns:1fr 300px}}
.anchoTop{display:grid;grid-template-columns:1fr 380px;gap:12px;align-items:start}
.anchoTop .top{margin:0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 2px 0 var(--line)}
.cols{display:grid;gap:12px;align-items:start}.cols.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.col{padding:0;overflow:hidden}.col .row{padding:10px 12px}
.colh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--black);color:#fff;border-bottom:5px solid var(--brand)}

.colh.B{border-color:#f5c400}.colh.N{border-color:#a14fe0}.colh.W{border-color:#18b47b}.colh.A{border-color:var(--red)}
.sedes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sede{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px;cursor:pointer}
.sede.on{border-color:var(--black);box-shadow:inset 0 -4px 0 var(--brand)}.sede h3{margin:0 0 4px;font:700 16px 'Baloo 2','Poppins',sans-serif}
.sede .t{font-size:18px;font-weight:700}.sede .m{font-size:12px;color:var(--mut)}
.sede .al{margin-top:6px;font-size:12px;font-weight:600}
.al.bad{color:var(--red)}.al.good{color:var(--ok)}

.top{display:flex;gap:8px;align-items:center;margin-bottom:10px}

<script>
var API='https://script.google.com/macros/s/AKfycbxYswm-RRonzElmqhAdP0SUQ3nWZ3tNDhlV0BrcPljIgZ77_UsJS8oYNVEVYBiq6Eng/exec';
window.APP=(function(){
  // La clave de la sede llega una vez por el link (?s=clave) y el celular la recuerda; el servidor la valida
  var q=new URLSearchParams(location.search), s=(q.get('s')||'').trim().toLowerCase();
  // Administración: el link trae ?a=<PIN>; se guarda en el celular y no se vuelve a pedir
  if(q.has('a')){s='';try{localStorage.removeItem('pg_radar_s');localStorage.setItem('pg_radar_pin',q.get('a')||'')}catch(e){}history.replaceState(null,'',location.pathname)}
  else if(q.has('s')){try{if(s)localStorage.setItem('pg_radar_s',s);else localStorage.removeItem('pg_radar_s')}catch(e){}history.replaceState(null,'',location.pathname)}
  else{try{s=localStorage.getItem('pg_radar_s')||''}catch(e){}}
  var t=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Bogota'}));
  var hoy=('0'+t.getDate()).slice(-2)+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+t.getFullYear();
  return {modo:s?'cajero':'admin',sede:s,nombre:'',sedes:[],hoy:hoy};
})();
function equipoQS(){
  // 18 nov 2026: cada equipo se identifica (sin datos personales) para saber quién tiene el radar instalado como app
  var d='';try{d=localStorage.getItem('pg_radar_dev')||'';if(!d){d=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);localStorage.setItem('pg_radar_dev',d)}}catch(e){}
  var app=false;try{app=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: window-controls-overlay)').matches||navigator.standalone===true}catch(e){}
  var t=/Android|iPhone|iPad/i.test(navigator.userAgent)?'celular':'computador';
  return d?'&d='+d+'&m='+(app?'app':'web')+'&t='+t:'';
}
function api(params,ok,fail){
  var qs=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k])}).join('&'), u=API+'?'+qs;
  // 18 nov 2026: las consultas del radar van primero a Cloudflare (rápido, con los pagos que llegan directo del banco);
  // si Cloudflare no responde, se lee de Google como antes.
  var rapido=(params.api==='cajero'||params.api==='admin');
  var pedir=rapido?fetch('https://pizzerito-equipo.soyanibaldiaz.workers.dev/radar/datos?'+qs+(S&&S.fresh?'&fresh=1':'')+equipoQS()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){if(!j||(!j.ok&&!/PIN/i.test(j.error||'')))throw 0;return j}).catch(function(){return fetch(u,{redirect:'follow'}).then(function(r){return r.json()})})
                :fetch(u,{redirect:'follow'}).then(function(r){return r.json()});
  if(S)S.fresh=false;
  pedir.then(function(j){
    if(j.hoy)A.hoy=j.hoy;
    if(j.ok&&A.modo==='cajero'&&j.data&&j.data.nombre){A.nombre=j.data.nombre;document.title='Radar · '+A.nombre+' · Pizza Gourmet'}
    if(j.ok&&A.modo==='admin'&&j.data&&j.data.map)A.sedes=j.data.map(function(x){return {k:x.sede,n:x.nombre}});
    if(j.ok){
      // Pagos que el radar aún está buscando ("⏳ Buscando" en la columna de orden): no tienen orden todavía
      (j.data&&j.data.map?j.data:[j.data]).forEach(function(s){(s&&s.pagos||[]).forEach(function(p){
        if(/Buscando/i.test(p.orden||'')){p.orden='';if(p.estado==='ok')p.estado='espera'}
      })});
      S.auto=!!(j.rapido&&j.rapido.autonomo);
      ok(j.data);
    }else fail(new Error(j.error||'Error'));
  }).catch(function(){fail(new Error('Sin conexión con el radar. Revisa el internet y vuelve a intentar.'))});
}
var A=window.APP, S={data:null,filtro:'todos',q:'',sede:'',fecha:A.hoy,pin:''};
var ICON={ok:'✅',sin:'❌',espera:'⏳',dif:'⚠️',verificar:'🔎',reembolso:'↩️'};

var TICK={x:null,last:0,vel:55,html:''};
function tickHTML(L,conSede){
  // 2 últimos pagos por medio (Bancolombia, Nequi y Wompi si hay), numerados 1 · último y 2; el aviso "1 · último" titila
  var reales=(L||[]).filter(function(p){return p.estado!=='verificar'&&p.estado!=='reembolso'&&p.valor>0}).slice();

  var uno=['Bancolombia','Nequi','Wompi'].map(function(m){return reales.filter(function(p){return p.medio===m}).slice(0,2).map(item).join('')}).join('');
  if(!uno)return '<div class="tick"><div class="tick-in"><span class="tk B" style="background:#444;color:#ccc">Esperando pagos de hoy…</span></div></div>';
  return '<div class="tick"><div class="tick-in">'+uno+uno+uno+'</div></div>';   // repetido para que la cinta no quede vacía
}
function tickMover(t){
  var dt=TICK.last?Math.min(.1,(t-TICK.last)/1000):0; TICK.last=t;
  var el=document.querySelector('.tick-in');
  if(el){
    var w=el.scrollWidth/3||1, caja=el.parentNode.clientWidth;
    if(TICK.x===null)TICK.x=0;
    TICK.x-=TICK.vel*dt;
    if(TICK.x<-w)TICK.x+=w;
    el.style.transform='translateX('+TICK.x.toFixed(1)+'px)';
  }
  requestAnimationFrame(tickMover);
}
requestAnimationFrame(tickMover);

/* ---------- Demora del último pago (18 nov 2026): cuánto tardó en llegar al radar desde que el cliente pagó ---------- */
function demoraHTML(lista){
  var c=(lista||[]).filter(function(p){return p.llego&&p.hora}).sort(function(a,b){return (b.min||0)-(a.min||0)})[0];
  if(!c)return '';
  var f=S.fecha.split('-'), hm=String(c.hora).split(':');
  var t=Date.UTC(+f[2],+f[1]-1,+f[0],+hm[0]+5,+hm[1])+30000;   // hora del banco (Colombia = UTC-5), a mitad del minuto
  var s=Math.max(1,Math.round((c.llego-t)/1000));

  var cls=s<90?'ok':s<300?'med':'mal';
  return '<em class="dem '+cls+'" title="El último pago ('+esc(c.hora)+') llegó al radar '+txt+' después de que el cliente pagó">⚡ llegó en '+txt+'</em>';

/* ---------- Sonido (18 nov 2026): suena cuando entra un pago nuevo al radar ---------- */
// 💰 pago con orden o esperando orden: "ding" alegre · ❌ sin orden / ⚠️ pagó distinto: doble tono de alerta.
// El navegador solo deja sonar después de tocar la pantalla: por eso el botón 🔔 (se recuerda en el equipo).
var SON={on:false,ctx:null,vistos:null,clave:''};

function tono(f,ini,dur,tipo,vol){
  var c=SON.ctx,o=c.createOscillator(),g=c.createGain();o.type=tipo||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,c.currentTime+ini);g.gain.linearRampToValueAtTime(vol||.35,c.currentTime+ini+.02);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+ini+dur);o.connect(g);g.connect(c.destination);o.start(c.currentTime+ini);o.stop(c.currentTime+ini+dur+.05);
}

  if(!SON.on)return;

  if(tipo==='alerta'){tono(880,0,.18,'square',.18);tono(660,.22,.18,'square',.18);tono(880,.44,.18,'square',.18);tono(660,.66,.25,'square',.18)}
  else{tono(1046,0,.25);tono(1568,.12,.45)}
}
function sonarNuevos(d){
  var L=Array.isArray(d)?[].concat.apply([],d.map(function(s){return s.pagos||[]})):(d.pagos||[]);
  var clave=(A.sede||'admin')+'|'+S.fecha, ahora={};
  L.forEach(function(p){if(p.estado!=='verificar')ahora[p.medio+'|'+p.valor+'|'+p.hora]=p});   // sin la orden: cuando el pago se cruza no vuelve a sonar
  if(SON.clave!==clave||!SON.vistos){SON.clave=clave;SON.vistos=ahora;return}   // primera carga o cambio de día: no suena
  var nuevos=Object.keys(ahora).filter(function(k){return !SON.vistos[k]}).map(function(k){return ahora[k]});
  SON.vistos=ahora;
  if(!nuevos.length||S.fecha!==A.hoy)return;
  var malo=nuevos.some(function(p){return p.estado==='sin'||p.estado==='dif'});
  sonar(malo?'alerta':'pago');
  var p=nuevos[0];
  msgAcc((malo?'⚠️ ':'💰 ')+(nuevos.length>1?nuevos.length+' pagos nuevos':'Nuevo pago '+p.medio+' '+cop(p.valor)+' · '+p.nombre));
}
(function(){

  b.addEventListener('click',function(){SON.on=!SON.on;try{localStorage.setItem('pg_radar_sonido',SON.on?'1':'0')}catch(e){}
    b.className='sonido'+(SON.on?' on':'');b.textContent=SON.on?'🔔 Sonido':'🔕 Sonido';if(SON.on)sonar('pago');});
  // si quedó prendido, se activa con el primer toque en la pantalla
  document.addEventListener('pointerdown',function(){if(SON.on&&!SON.ctx){try{SON.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}},{once:true});
})();

function render(){
  var app=$('app'), act=document.activeElement, enQ=act&&act.tagName==='INPUT'&&act.getAttribute('inputmode')==='search';
  if(A.modo==='admin'&&!S.data){app.innerHTML=vistaPin(S.err);return}

  setTimeout(pintarRev,0);

  if(enQ){var q=app.querySelector('input[inputmode=search]');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}
function cargar(){
  var ok=function(d){
    var pr=Array.isArray(d)?Promise.all(d.map(function(s){return conWompi(CLAVES[s.sede],S.fecha,s.pagos).then(function(p){s.pagos=p})}))
                           :conWompi(A.sede,S.fecha,d.pagos).then(function(p){d.pagos=p});
    pr.then(function(){S.data=d;S.err='';SAL.okT=Date.now();sonarNuevos(d);if(!Array.isArray(d))sonarTardes(d.pagos||[]);var ae=document.activeElement;if(!(ae&&ae.classList&&ae.classList.contains('notaIn')))render();cargarRegistro()});
  };
  var fail=function(e){
    if(A.modo==='admin'&&/PIN/.test(e.message)){S.data=null;S.err=e.message;try{localStorage.removeItem('pg_radar_pin')}catch(x){}render();return}
    var a=$('app');if(a&&!S.data)a.innerHTML='<div class="empty">No se pudo cargar: '+esc(e.message)+'</div>';
  };
  if(A.modo==='cajero')api({api:'cajero',s:A.sede,f:S.fecha},ok,fail);
  else{if(!S.pin){render();return}api({api:'admin',pin:S.pin,f:S.fecha},ok,fail)}
}
try{S.pin=localStorage.getItem('pg_radar_pin')||''}catch(e){}
cargar();

setInterval(function(){if(document.visibilityState==='visible'&&(A.modo==='cajero'||S.pin))cargar()},15000);
